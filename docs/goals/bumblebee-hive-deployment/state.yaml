        - "go test ./..."
        - "git diff --check"
      stop_if:
        - "Implementation needs Cloudflare-specific CLI flags or package imports."
        - "Custom headers can override Bumblebee-managed headers."
        - "Secrets are accepted as literal CLI values instead of env vars."
        - "Tests cannot verify custom headers with HMAC plus gzip."

