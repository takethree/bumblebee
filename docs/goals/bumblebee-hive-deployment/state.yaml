      - "docs/deployment-windows.md"
      - "docs/state-model.md"
      - "cmd/bumblebee HTTP sink flags and output package"
      - "Official Cloudflare Workers, Access, R2, D1, Queues, and limits docs"
      - "Official Microsoft Scheduled Tasks, Get-FileHash, Authenticode, and Windows secret-storage docs"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Prefer official/vendor docs over blog posts."
      - "Record exact source links and any changed product constraints."
      - "Keep the receiver scope to raw archive plus run index unless evidence proves that insufficient."
    expected_output:
      - "Source-backed architecture confirmation or corrections"
      - "Exact first Worker slice recommendation"
      - "Security and limits notes that affect implementation"
      - "Any required docs updates or open decisions"
    receipt:
      result: done
      note: notes/T001-source-validation.md
      summary: "Validated the plan against repo docs/code and official Cloudflare/Microsoft sources. Access-plus-HMAC is viable, but requires a generic env-backed custom HTTP header slice in Bumblebee before Hive ingest can be hidden behind Cloudflare Access."
