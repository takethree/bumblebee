# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Bumblebee Hive Deployment"
  slug: "bumblebee-hive-deployment"
  kind: existing_plan
  tranche: "Complete the first deployable Windows self-service install plus Cloudflare Worker receiver path."
  status: done
  oracle:
    signal: "A Windows Bumblebee deployment smoke uploads a complete gzip NDJSON scan through Cloudflare Access plus Bumblebee HMAC into Hive, and Hive durably records raw batch data plus a run index before returning 2xx."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts show source validation, Bumblebee transport tests, Hive Worker tests, bootstrapper tests, and an end-to-end local/dev smoke with a complete scan_summary recorded."
  intake:
    original_request: "Come up with a deployment plan and a secure endpoint application to receive Bumblebee transport data."
    interpreted_outcome: "Build an operator-deployable, secure, low-friction Windows deployment path and Cloudflare Worker receiver for Bumblebee inventory."
    input_shape: existing_plan
    audience: "Windows developers and operators receiving Bumblebee inventory"
    authority: approved
    proof_type: test
    completion_proof: "A configured Windows Bumblebee install sends a complete scan to Hive through Access plus HMAC, and Hive records the raw payload and run metadata."
    likely_misfire: "Implementing a receiver or installer that looks plausible but breaks Bumblebee's transport contract, requires manual developer configuration, or creates hard-to-maintain fork divergence."
    blind_spots_considered:
      - "Cloudflare Access service-token headers require Bumblebee support for env-backed custom headers."
      - "HMAC must verify against the exact raw body before gzip decompression."
      - "Cloudflare request-size limits require bounded batch sizing and gzip."
      - "Per-device HMAC secrets need local Windows secret handling and receiver-side lifecycle decisions."
      - "Raw inventory and secrets must not leak into committed receipts."
      - "A dashboard is useful later but not required for first durable ingest."
    existing_plan_facts:
      - "Name the sibling receiver app Bumblebee Hive unless the user later renames it."
      - "Use Cloudflare Workers behind Zero Trust."
      - "Protect ingest with Cloudflare Access service token headers plus Bumblebee HMAC."
      - "Use R2 for immutable raw batches."
      - "Use D1 for device, batch, and run indexes."
      - "Use Queues for async normalization hooks."
      - "Add generic env-backed HTTP headers to Bumblebee rather than Cloudflare-specific code."
      - "Self-service install should download, verify, install, enroll, configure, schedule, and smoke test Bumblebee without developer flag work."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/bumblebee-hive-deployment/"
    command: "npx goalbuddy board docs/goals/bumblebee-hive-deployment"

active_task: null

