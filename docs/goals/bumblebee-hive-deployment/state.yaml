        - "cmd/bumblebee/sink.go"
        - "cmd/bumblebee/*test.go"
        - "internal/output/httpsink.go"
        - "internal/output/httpsink_test.go"
        - "docs/transport.md"
        - "docs/deployment-windows.md"
        - "README.md"
