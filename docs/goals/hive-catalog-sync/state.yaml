version: 2

goal:
  title: "Hive Catalog Sync"
  slug: "hive-catalog-sync"
  kind: existing_plan
  tranche: "Validate and implement the first cross-repo Hive-managed catalog sync vertical slice."
  status: done
  oracle:
    signal: "A local/test Hive publishes a validated catalog, Bumblebee joins and syncs it, hive run emits findings with catalog metadata, and Hive stores/displays the resulting finding."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing Bumblebee tests, Hive tests, cross-repo integration proof, docs, and final audit receipt."
  intake:
    original_request: "$goalbuddy:goal-prep"
    interpreted_outcome: "Prepare a GoalBuddy board for implementing Hive-managed exposure catalog sync across Bumblebee and Bumblebee Hive."
    input_shape: existing_plan
    audience: "Bumblebee operators, endpoint users, and maintainers"
    authority: approved
    proof_type: test
    completion_proof: "Join, sync, cache fallback, hive run, Hive catalog publishing, and findings visibility are implemented and verified."
    likely_misfire: "Implementing only a Windows wrapper sync, silently enabling bundled threat_intel, or making normal scans network-dependent."
    blind_spots_considered:
      - "Hive support must be cross-platform in Bumblebee."
      - "Hive should auto-sync upstream threat_intel."
      - "Bumblebee should use last-known-good catalog cache on sync failure."
      - "No valid cache means hive run fails rather than silently omitting findings."
      - "Normal bumblebee scan semantics should remain explicit and unchanged."
      - "Catalog provenance and hash metadata should be visible enough for operators to know what ran."
    existing_plan_facts:
      - "Add Bumblebee commands: hive join, hive catalog sync, hive run."
      - "Add Hive catalog publishing and current catalog endpoints."
      - "Add local protected config/secrets for Windows, macOS, and Linux."
      - "Hive auto-syncs upstream Bumblebee threat_intel and keeps last-known-good on failure."
      - "Bumblebee sync verifies manifest/file hashes and parses catalogs before activating the cache."
      - "Hive run syncs first, falls back to cache, scans with --exposure-catalog equivalent behavior, and uploads to Hive."
      - "Add scan_summary catalog metadata for Hive runs if Judge approves the schema-compatible shape."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: unavailable
    url: "http://goalbuddy.localhost:41737/hive-catalog-sync/"
    last_error: "npx goalbuddy board failed before serving the board because catalog fetch returned HTTP 404 for https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json. File-backed board remains usable."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current Bumblebee and Hive implementation surfaces relevant to catalog sync without changing code."
    inputs:
      - "F:/bumblebee"
      - "F:/bumblebee-hive"
      - "Approved proposed plan from chat"
    constraints:
      - "Read-only."
      - "Do not implement, stage, commit, push, deploy, or mutate either repo."
      - "Record exact files, commands, schemas, and tests the Worker will need."
    expected_output:
      - "Current-state findings for Bumblebee CLI/config/catalog/schema surfaces."
      - "Current-state findings for Hive routes/storage/installer/admin UI surfaces."
      - "Risks or missing decisions."
      - "Recommended first Worker slice."
    receipt:
      result: done
      path: "docs/goals/hive-catalog-sync/notes/T001-scout.md"
      summary: "Mapped current Bumblebee and Hive surfaces for catalog sync. Bumblebee has explicit exposure-catalog loading, findings emission, and HTTP transport but no Hive command/config/cache layer. Hive has enrollment, signed ingest, normalized findings storage, and admin visibility but no catalog publishing/storage endpoint. Recommended a local/test-backed vertical slice covering Hive catalog publishing, Bumblebee join/sync/run with last-known-good cache, and findings ingestion proof."
      evidence:
        - "docs/goals/hive-catalog-sync/notes/T001-scout.md"
        - "cmd/bumblebee/main.go"
        - "internal/exposure/exposure.go"
        - "internal/scanner/scanner.go"
        - "internal/output/httpsink.go"
        - "F:/bumblebee-hive/src/index.ts"
        - "F:/bumblebee-hive/migrations/0001_init.sql"
        - "F:/bumblebee-hive/migrations/0005_normalized_inventory.sql"
      risks:
        - "Catalog metadata on scan_summary would be an additive public schema change and needs Judge approval."
        - "Normal bumblebee scan must remain explicit and local-only."
        - "Config/cache must be cross-platform, not Windows-only."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the planned cross-repo design and choose the largest safe first implementation slice."
    inputs:
      - "T001 receipt."
      - "docs/goals/hive-catalog-sync/goal.md"
      - "Current Bumblebee and Hive source evidence."
    constraints:
      - "Read-only."
      - "Preserve the user's approved command shape unless source evidence proves it unsafe."
      - "Reject Windows-only implementation."
      - "Reject hidden normal-scan network behavior."
    expected_output:
      - "approve | revise | block"
      - "Exact first Worker objective."
      - "allowed_files across both repos."
      - "verify commands for both repos."
      - "stop_if conditions."
    receipt:
      result: done
      decision: approve
      path: "docs/goals/hive-catalog-sync/notes/T002-judge.md"
      summary: "Approved a bounded first Worker slice: implement local/test-backed Hive catalog publishing plus Bumblebee hive join, catalog sync, and hive run with last-known-good cache fallback. Normal scan remains unchanged; no deploy, remote migration, or production secret work is included."
      exact_first_worker_objective: "Implement a local/test-backed Hive catalog sync vertical slice across Bumblebee and Hive."
      allowed_files:
        bumblebee:
          - "cmd/bumblebee/main.go"
          - "cmd/bumblebee/main_test.go"
          - "cmd/bumblebee/hive.go"
          - "cmd/bumblebee/hive_test.go"
          - "internal/hive/**"
          - "internal/model/model.go"
          - "internal/model/model_test.go"
          - "docs/schema/v0.1.0/scan-summary.schema.json"
          - "README.md"
          - "docs/transport.md"
          - "docs/goals/hive-catalog-sync/**"
        hive:
          - "F:/bumblebee-hive/src/index.ts"
          - "F:/bumblebee-hive/test/ingest.test.ts"
          - "F:/bumblebee-hive/test/e2e.test.ts"
          - "F:/bumblebee-hive/migrations/0009_catalog_releases.sql"
          - "F:/bumblebee-hive/README.md"
          - "F:/bumblebee-hive/docs/goals/**"
      verify:
        - "go test -count=1 ./cmd/bumblebee ./internal/hive ./internal/exposure ./internal/scanner ./internal/output ./internal/model"
        - "go test -count=1 ./..."
        - "npm test in F:/bumblebee-hive"
        - "npm run build in F:/bumblebee-hive"
      stop_if:
