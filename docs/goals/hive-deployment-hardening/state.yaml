# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Hive Deployment Hardening"
  slug: "hive-deployment-hardening"
  kind: existing_plan
  tranche: "Harden the proven Bumblebee + Hive deployment path except the second-machine pilot."
  status: done
  oracle:
    signal: "Installer lifecycle, Hive device revocation, and deployment runbooks are implemented, verified, and audited with the second-machine pilot explicitly out of scope."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing Hive tests/typecheck/lint, installer uninstall verification, admin revoke verification, updated docs/receipts, clean git status or documented intended commits, and final audit with full_outcome_complete: true."
  intake:
    original_request: "Come up with a plan for everything except number four, then $goalbuddy:goal-prep."
    interpreted_outcome: "Prepare a GoalBuddy board to implement docs/runbooks, uninstall lifecycle, Hive admin revocation, and rotated wave-token guidance while excluding the second-machine pilot."
    input_shape: existing_plan
    audience: "Maintainer/operator of the Bumblebee Windows compatibility fork and Bumblebee Hive receiver."
    authority: approved
    proof_type: test
    completion_proof: "All planned hardening slices are implemented and verified, and final audit confirms no second-machine pilot or broader rollout was attempted."
    likely_misfire: "Only documenting the successful pilot, or drifting into second-machine/fleet rollout before the operator is ready."
    blind_spots_considered:
      - "Cloudflare Access Service Auth policy must be documented because Allow returns login HTML."
      - "Hive source must remain organization-neutral."
      - "Local uninstall must not imply remote device revocation."
      - "Enrollment remains rotated wave-token guidance, not one-time token infrastructure."
      - "Cross-repo docs and code must remain aligned."
    existing_plan_facts:
      - "Update Hive README, Bumblebee Windows deployment docs, and windows.md."
      - "Add installer -Uninstall that removes local state by default."
      - "Add POST /v1/admin/devices/:device_id/disable protected by Access plus X-Hive-Admin-Token."
      - "Document Wrangler D1 fallback for manual device disable."
      - "Use rotated wave enrollment-token guidance, not one-time token infrastructure."
      - "Do not perform the second-machine pilot."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/hive-deployment-hardening"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the approved deployment-hardening plan against both repos and choose the first largest safe Worker package."
    inputs:
      - "docs/goals/hive-deployment-hardening/goal.md"
      - "docs/goals/hive-deployment-hardening/state.yaml"
      - "Prior verified pilot facts from the conversation"
      - "F:/bumblebee"
      - "F:/bumblebee-hive"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve the explicit exclusion of the second-machine pilot."
      - "Reject any slice that would add TakeThree-specific defaults to public Hive source."
    expected_output:
      - "Decision: approve | revise | block"
      - "Any plan corrections based on current repo state"
      - "Exact first Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: approve_with_sequence_correction
      summary: "The approved tranche matches current repo state. Hive has enroll/ingest only, devices already have disabled_at, and the installer has no uninstall path. Final docs should follow behavior implementation to avoid overclaiming."
      exact_first_worker_objective: "Add local uninstall lifecycle support to the Hive Windows bootstrapper and verify install/uninstall behavior in temporary roots."
      allowed_files:
        - "../bumblebee-hive/scripts/install-bumblebee.ps1"
        - "../bumblebee-hive/test/e2e.test.ts"
        - "../bumblebee-hive/README.md"
      verify:
        - "npm test"
        - "npm run typecheck"
        - "npm run lint"
        - "A temp-root install/uninstall smoke that does not delete the real pilot install."
      stop_if:
        - "Uninstall would remove paths outside the configured InstallRoot or ConfigRoot."
        - "Verification requires deleting the current real pilot install."
        - "Need a remote Hive revoke during local uninstall."

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Update deployment docs and receipts for the verified Hive installer path, Service Auth troubleshooting, and rotated wave-token process."
    allowed_files:
      - "README.md"
      - "docs/deployment-windows.md"
      - "windows.md"
      - "../bumblebee-hive/README.md"
    verify:
      - "git diff --check"
      - "rg -n \"TakeThree|takethree|take3|bbutner|brad\" ../bumblebee-hive/README.md"
      - "rg -n \"Service Auth|X-Hive-Enroll-Token|ReleaseBaseUrl|scheduled task|rotat\" ../bumblebee-hive/README.md docs/deployment-windows.md windows.md"
    stop_if:
      - "Need to document real secret values."
      - "Need to perform the second-machine pilot."
      - "Docs would claim unsupported fleet behavior."
    receipt:
      result: done
      changed_files:
        - "README.md"
        - "docs/deployment-windows.md"
        - "windows.md"
        - "../bumblebee-hive/README.md"
      commands:
        - cmd: "git diff --check"
          status: pass
        - cmd: "rg org-specific names in Hive README"
          status: pass
        - cmd: "rg required deployment terms across docs"
          status: pass
      summary: "Updated runbooks and receipts for the verified release download/checksum path, Cloudflare Access Service Auth failure mode, local uninstall versus remote device disable, and rotated wave-token enrollment process without adding organization-specific Hive defaults."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Add local uninstall lifecycle support to the Hive Windows bootstrapper and verify install/uninstall behavior in temporary roots."
    allowed_files:
      - "../bumblebee-hive/scripts/install-bumblebee.ps1"
      - "../bumblebee-hive/test/e2e.test.ts"
      - "../bumblebee-hive/README.md"
    verify:
      - "npm test"
      - "npm run typecheck"
      - "npm run lint"
      - "A temp-root install/uninstall smoke that does not delete the real pilot install."
    stop_if:
      - "Uninstall would remove paths outside the configured InstallRoot or ConfigRoot."
      - "Verification requires deleting the current real pilot install."
      - "Need a remote Hive revoke during local uninstall."
    receipt:
      result: done
      changed_files:
        - "../bumblebee-hive/scripts/install-bumblebee.ps1"
        - "../bumblebee-hive/test/e2e.test.ts"
        - "../bumblebee-hive/README.md"
      commands:
        - cmd: "npm test"
          status: pass
        - cmd: "npm run typecheck"
          status: pass
        - cmd: "npm run lint"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added -Uninstall support that removes scheduled task plus generated local files, removes install/config directories only when empty, and added an idempotent temp-root uninstall regression test that preserves unrelated files."

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Add Hive admin device-disable support with ADMIN_TOKEN protection, tests, and D1 fallback documentation."
    allowed_files:
      - "../bumblebee-hive/src/index.ts"
      - "../bumblebee-hive/test/ingest.test.ts"
      - "../bumblebee-hive/test/e2e.test.ts"
      - "../bumblebee-hive/README.md"
      - "../bumblebee-hive/wrangler.toml"
    verify:
      - "npm test"
      - "npm run typecheck"
      - "npm run lint"
    stop_if:
      - "Need to expose or commit a real ADMIN_TOKEN."
      - "Need schema changes beyond the existing disabled_at column."
      - "Admin endpoint cannot be protected by Access plus X-Hive-Admin-Token."
    receipt:
      result: done
      changed_files:
        - "../bumblebee-hive/src/index.ts"
        - "../bumblebee-hive/test/ingest.test.ts"
        - "../bumblebee-hive/test/e2e.test.ts"
        - "../bumblebee-hive/README.md"
      commands:
        - cmd: "npm test"
          status: pass
        - cmd: "npm run typecheck"
          status: pass
        - cmd: "npm run lint"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added POST /v1/admin/devices/:device_id/disable protected by Cloudflare Access plus X-Hive-Admin-Token, reusing disabled_at for active-device filtering. Tests cover successful disable, missing admin token, invalid Access precedence, and disabled-device ingest rejection."

  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Deploy Hive changes if needed and run a redacted live admin-revoke smoke against a test-only enrolled device."
    allowed_files:
      - "../bumblebee-hive/README.md"
      - "../bumblebee-hive/.local"
      - "../bumblebee-hive/.local/deployment-secrets.clixml"
      - "docs/goals/hive-deployment-hardening/notes"
      - "docs/goals/hive-deployment-hardening/state.yaml"
    verify:
      - "npx wrangler deploy --config wrangler.deploy.toml"
      - "Enroll a test-only device with redacted output."
      - "Disable that test-only device with redacted output."
      - "Confirm ingest for the disabled test-only device is rejected."
    stop_if:
      - "ADMIN_TOKEN is unavailable and cannot be generated or set safely."
      - "Cloudflare Access no longer passes Service Auth requests."
      - "The test would touch the real installed pilot device."
      - "Need to perform a second-machine pilot."
    receipt:
      result: done
      changed_files:
        - "../bumblebee-hive/.local/deployment-secrets.clixml"
      commands:
        - cmd: "npx wrangler secret put ADMIN_TOKEN --config wrangler.deploy.toml"
          status: pass
        - cmd: "npx wrangler deploy --config wrangler.deploy.toml"
          status: pass
        - cmd: "redacted live admin-revoke smoke"
          status: pass
      summary: "Generated and DPAPI-stored a local ADMIN_TOKEN, set the Worker secret, deployed Hive version 28ca337a-8601-4eb1-aff9-de6f490d580e, enrolled a test-only goal-smoke device, disabled it through the admin endpoint, and confirmed later ingest was rejected with unknown_device. The real pilot device and second-machine pilot were not touched."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the deployment hardening tranche is complete and the second-machine pilot stayed out of scope."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Current Hive deployment status if T005 ran"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if docs, installer behavior, and Hive admin revoke behavior disagree."
      - "Reject completion if a second-machine pilot was performed or silently planned as complete."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "verification evidence"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The deployment hardening tranche is complete. Docs/runbooks record the verified installer path, Service Auth setup, rotated wave-token process, uninstall/revoke separation, and deployment receipt. Hive implements local uninstall support and admin device disable. Verification passed and live Hive revoke smoke succeeded without touching the real pilot device or performing the second-machine pilot."
      evidence:
        - "Hive tests/typecheck/lint passed with 12 tests."
        - "git diff --check passed in both repos."
        - "GoalBuddy state checker passed."
        - "Hive deployed version 28ca337a-8601-4eb1-aff9-de6f490d580e."
        - "Live goal-smoke device enrollment, disable, and disabled ingest rejection passed."
        - "Hive source pushed at b6a2faf."
      missing_evidence: []
      next_task: null

checks:
  dirty_fingerprint: unknown
  last_verification:
    result: pass
    task: T999
    commands:
      - "npm test"
      - "npm run typecheck"
      - "npm run lint"
      - "git diff --check in both repos"
      - "GoalBuddy state checker"
      - "redacted live admin-revoke smoke"
