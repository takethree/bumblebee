version: 2
goal:
  slug: hive-operator-safety
  title: Hive Operator Safety
  status: done
  created_at: "2026-05-28"
  updated_at: "2026-05-28"
  mode: existing_plan
  objective: "Implement operator-safety hardening across Bumblebee and Bumblebee Hive so test data cannot be mistaken for production compromise evidence."
  oracle:
    type: test_demo
    signal: "Local and live checks prove installer uses hive run, default admin views show production only, test findings require explicit test filtering, purge removes test devices and related data, and join is idempotent by default."
    final_proof: "A final audit receipt confirms local and live verification passed, default production findings are clean, a test fixture finding is isolated to environment=test, purge removes the test device data, installer uses hive run, join is idempotent, and both repos are committed/pushed."
  completion_proof:
    - "Bumblebee Go tests pass."
    - "Hive unit/E2E/build tests pass."
    - "Cross-repo E2E proves test fixture findings are isolated from production views."
    - "Live Hive deployment has exactly the intended production device state after purge and smoke verification."
  constraints:
    - "Do not print or commit secrets, HMAC keys, enrollment tokens, raw object keys, local usernames, hostnames, SIDs, or full local profile paths."
    - "Do not rely on direct D1 deletes as the durable operator workflow."
    - "Keep Hive organization-neutral and open-source friendly."
    - "Do not change normal Bumblebee scan semantics; Hive-managed catalog sync belongs to hive run."
  likely_misfire: "Hiding test rows in the UI or manually cleaning the current database without adding durable product safeguards."
  intake:
    original_request: "okay come up with a plan"
    interpreted_outcome: "Prepare and execute the Hive operator-safety hardening plan after a test finding appeared like real compromise evidence."
    input_shape: existing_plan
    authority: requested
    proof_type: test_demo
    completion_proof: "Bumblebee and Hive tests pass, cross-repo E2E proves test finding isolation and purge, live Hive verification shows production views clean, installer uses scheduled hive run, and final git state is committed and pushed."
    audience: "Hive operator and future developers installing Bumblebee on Windows workstations."
    existing_plan_facts:
      - "Windows installer should use bumblebee hive join and scheduled bumblebee hive run."
      - "Hive should support production/test device environment isolation."
      - "Admin/UI views should default to production data."
      - "Hive should provide a guarded purge path for stale/test devices."
      - "Bumblebee hive join should reuse existing local identity unless a new device is explicitly requested."
      - "Live verification should prove production findings stay clean."
agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed
