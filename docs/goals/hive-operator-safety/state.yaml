      - "Exact implementation surfaces for installer, join, enroll, admin filters, purge/retention, and E2E tests."
      - "Live Hive baseline summary: production device count, findings count, and whether any test/stale data remains, all redacted."
      - "Risks or plan corrections before implementation."
