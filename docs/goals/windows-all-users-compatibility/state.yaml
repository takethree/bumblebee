# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows All-Users Compatibility Layer"
  slug: "windows-all-users-compatibility"
  kind: existing_plan
  tranche: "Implement Windows --all-users as a compatibility-layer equivalent of the existing macOS behavior, then verify and audit for drift."
  status: done
  oracle:
    signal: "Windows baseline/project --all-users expands curated per-user roots across local Windows profile homes while preserving macOS guardrails and no schema/parser/sink drift."
    cadence: "after the implementation Worker package and at final audit"
    final_proof: "Targeted Go tests pass, Windows smoke script passes, windows.md Goal 5 is updated, and final audit records full_outcome_complete: true."
  intake:
    original_request: "Plan and execute Windows multi-user scanning as feature parity with macOS --all-users, as a Windows compatibility layer that does not do things Bumblebee does not do."
    interpreted_outcome: "Windows gets bounded baseline/project --all-users expansion equivalent to macOS, with no broader scanner model changes."
    input_shape: existing_plan
    audience: "Windows fork maintainers and future upstream reviewers"
    authority: approved
    proof_type: test
    completion_proof: "Windows all-users behavior, tests, smoke receipt, docs update, and maintenance-risk audit all agree with the compatibility-layer requirement."
    likely_misfire: "Adding broad Windows profile discovery, registry/domain/Azure AD support, deep home crawling, new attribution fields, or schema/output changes instead of matching macOS semantics."
    blind_spots_considered:
      - "Windows current-user environment variables do not work for other users; cross-user paths must be derived from each enumerated home."
      - "Admin rights may be operationally necessary but should not become a new CLI permission gate."
      - "Non-C and redirected profiles are explicitly future work unless the existing local-profile parent fallback covers them without registry discovery."
    existing_plan_facts:
      - "Use existing --all-users flag; do not create a new mode."
      - "Support baseline and project only."
      - "Keep deep plus --all-users invalid."
      - "Keep explicit --root plus --all-users invalid."
      - "Never emit bare user homes for baseline or project."
      - "Use local profile-directory enumeration for Windows v1."
      - "Update CLI help, diagnostics, tests, and windows.md Goal 5."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: false
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-all-users-compatibility"
    note: "npx is not available on PATH in this shell, so the local board could not be started during goal prep."

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the proposed Windows --all-users plan against current macOS behavior, windows.md Goal 5, and existing root-resolution structure before any implementation."
    inputs:
      - "docs/goals/windows-all-users-compatibility/goal.md"
      - "windows.md Goal 5"
      - "cmd/bumblebee roots and CLI files"
      - "existing macOS --all-users tests"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve feature parity with macOS semantics."
      - "Reject registry, domain, Azure AD, redirected-profile, schema, sink, parser, deep-profile, or attribution expansion unless current Bumblebee already does it."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective if approved"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Any plan changes required to avoid divergence"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The proposed tranche matches the current macOS --all-users model: baseline/project only, explicit --root rejected, deep rejected, curated per-user subdirectories only, no bare homes, no schema/sink/parser attribution changes. Worker must derive Windows cross-user AppData candidates from each enumerated home while preserving current-user APPDATA/LOCALAPPDATA behavior."
      worker_objective: "Implement Windows --all-users as local-profile-directory expansion for baseline/project, with platform-appropriate profile filtering, home-derived Windows AppData candidates during expansion, CLI/diagnostic text updates, windows.md Goal 5 updates, and targeted tests."
      allowed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "cmd/bumblebee/main.go"
        - "cmd/bumblebee/main_test.go"
        - "windows.md"
      verify:
        - "go test ./cmd/bumblebee ./internal/..."
        - "powershell -ExecutionPolicy Bypass -File scripts/windows-smoke.ps1"
      stop_if:
        - "Need schema, parser, sink, endpoint attribution, ecosystem, or root-kind changes."
        - "Need registry, SID, domain, Azure AD, OneDrive, or redirected-profile discovery."
        - "Need to make deep --all-users valid or allow --all-users with explicit --root."
        - "Need to emit bare Windows user homes for baseline or project."

