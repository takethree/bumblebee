# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Current-User Baseline Roots"
  slug: "windows-baseline-roots-current-user"
  kind: existing_plan
  tranche: "Add the first safe current-user Windows baseline roots, excluding browsers and broader Windows feature work."
  status: done
  oracle:
    signal: "Windows baseline root tests prove current-user Go, editor-extension, and MCP roots resolve only when present with correct root kinds; browser/all-users/native ecosystem scope remains untouched; verification commands pass."
    cadence: "after Scout/Judge gate, after Worker implementation, and at final audit"
    final_proof: "Passing verification plus a Judge receipt mapping changed files and windows.md Goal 3 checkboxes to the approved current-user root set."
  intake:
    original_request: "Prepare the Goal 3A Windows baseline-roots plan with GoalBuddy, staying focused on windows.md and compatibility-layer work."
    interpreted_outcome: "A runnable GoalBuddy board exists for adding safe current-user Windows baseline roots without widening the scanner."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and Windows endpoint operators"
    authority: requested
    proof_type: test
    completion_proof: "Windows baseline candidate tests pass, roots preview test passes, absent candidates remain non-fatal, and windows.md marks only verified Goal 3 items complete."
    likely_misfire: "Adding browser roots, broad profile scanning, all-users, WSL, deployment docs, endpoint identity policy, or native Windows package ecosystems under the baseline-roots tranche."
    blind_spots_considered:
      - "Existing baselineHomeCandidates currently mixes cross-platform, OS-specific, and browser roots."
      - "Goal 4 owns browser coverage, so Windows browser roots must remain excluded."
      - "APPDATA/LOCALAPPDATA can be unset or redirected; the first slice should skip unset envs instead of guessing."
      - "Absent candidates are normal and should remain non-fatal."
      - "Some Windows package roots listed in windows.md need more source-backed design and should not be included in this first slice."
    existing_plan_facts:
      - "Keep Windows as a compatibility layer."
      - "Add only current-user Windows baseline roots for Go, editor extensions, and MCP config."
      - "Do not add browser roots."
      - "Use existing RootKind values."
      - "Add roots --profile baseline tests for Windows candidates."
      - "Update windows.md only for verified Goal 3 items."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-baseline-roots-current-user/"
    command: "npx goalbuddy board docs/goals/windows-baseline-roots-current-user"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map existing baseline root discovery and tests to the proposed Windows current-user root set."
    inputs:
      - "docs/goals/windows-baseline-roots-current-user/goal.md"
      - "windows.md"
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/roots_windows.go"
      - "cmd/bumblebee/roots_nonwindows.go"
      - "cmd/bumblebee/main_test.go"
      - "docs/inventory-sources.md"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not browse or research additional roots unless Judge later asks."
      - "Keep browser roots and all-users out of the recommended Worker package."
    expected_output:
      - "Existing baseline root map"
      - "Existing tests relevant to Windows baseline roots"
      - "Candidate roots approved by current plan"
      - "Candidate roots deferred"
      - "Recommended Worker package"
    receipt:
      result: done
      summary: "Existing baselineHomeCandidates already includes current-home Go and home-relative editor roots that map to Windows USERPROFILE when running on Windows. Windows APPDATA Claude is not yet included. Existing tests cover darwin/linux baseline roots and some Windows broad-root behavior, but not Windows baseline candidate inclusion, absent-candidate behavior, or roots preview."
      evidence:
        - "cmd/bumblebee/roots.go baselineHomeCandidates"
        - "cmd/bumblebee/roots_windows.go userHomeDir"
        - "cmd/bumblebee/main_test.go baseline root tests"
        - "windows.md Goal 3"
      existing_baseline_root_map:
        - "home/go -> RootKindUserPackage; already becomes USERPROFILE/go on Windows through userHomeDir."
        - "home/.vscode/extensions, .vscode-insiders/extensions, .cursor/extensions, .cursor-server/extensions, .windsurf/extensions, .windsurf-server/extensions, .vscodium/extensions -> RootKindEditorExtension; already become USERPROFILE-relative on Windows."
        - "home/.cursor, .codeium/windsurf, .claude, .codex, .gemini -> RootKindMCPConfig; already home-relative on Windows."
        - "darwin/linux OS-specific Claude locations exist; Windows APPDATA Claude does not."
        - "browserExtensionCandidateRoots has no Windows case, so Windows browser roots are not currently added."
      existing_tests:
        - "Baseline excludes project trees on darwin/linux."
        - "Baseline includes user-local Python on current OS."
        - "Baseline includes/skips Claude/Codex/Gemini dotfile MCP roots on darwin/linux."
        - "Windows broad-home detection is covered indirectly in TestIsBroadHomeRoot."
        - "No Windows test currently asserts baseline roots preview or APPDATA Claude."
      candidate_roots_approved_by_plan:
        - "%USERPROFILE%/go"
        - "%USERPROFILE%/.vscode/extensions"
        - "%USERPROFILE%/.vscode-insiders/extensions"
        - "%USERPROFILE%/.cursor/extensions"
        - "%USERPROFILE%/.cursor-server/extensions"
        - "%USERPROFILE%/.windsurf/extensions"
        - "%USERPROFILE%/.windsurf-server/extensions"
        - "%USERPROFILE%/.vscodium/extensions"
        - "%APPDATA%/Claude"
      candidate_roots_deferred:
        - "Browser profile roots under LOCALAPPDATA and APPDATA; Goal 4 owns these."
        - "Windows npm/global, Python, pipx, Ruby/Bundler, Composer roots; these need separate source-backed slices."
        - "All-users, WSL, deployment docs, endpoint identity, and native package ecosystems."
      recommended_worker_package: "Add a small Windows platform baseline candidate helper for APPDATA Claude, add Windows-only tests for current-user Go/editor/MCP roots and absent candidates, add a Windows runRoots baseline preview test, and update only verified windows.md Goal 3 checkboxes."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the candidate root set and approve the exact Worker implementation package."
    inputs:
      - "T001 receipt"
      - "windows.md"
      - "Current dirty diff"
    constraints:
      - "Read-only."
      - "Reject browser roots, all-users, WSL, deployment docs, endpoint identity, native ecosystems, schema/parser/sink/exposure/CLI/root-kind/profile changes."
      - "Reject any source-unsupported Windows package roots beyond the approved first slice."
      - "Prefer existing compatibility-layer helper boundaries."
    expected_output:
      - "Decision: approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "windows.md checkboxes allowed to mark"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The first Windows baseline slice can stay inside the compatibility-layer boundary. Current home-relative Go/editor roots already work on Windows through USERPROFILE, but need Windows tests. APPDATA Claude needs a small Windows-only candidate helper. Browser roots and package-manager roots remain deferred."
      worker_task: T003
      exact_worker_objective: "Add Windows APPDATA Claude baseline candidate support, add Windows-only tests proving current-user Go/editor/MCP roots and absent candidate handling, add roots preview coverage, and update only verified windows.md Goal 3 items."
      allowed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "cmd/bumblebee/main_test.go"
        - "windows.md"
      verify:
        - "go test ./..."
        - "go test -race ./..."
        - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
        - "./bumblebee.exe selftest"
        - "git diff --check"
      stop_if:
        - "Need files outside allowed_files."
        - "Need browser roots, all-users, WSL, deployment docs, endpoint identity, native ecosystem inventory, or unsupported package-manager roots."
        - "Need public schema, parser, sink, exposure, CLI, root-kind, profile, or emitted-record semantic changes."
        - "Need to guess APPDATA/LOCALAPPDATA paths when env vars are unset."
      windows_md_checkboxes_allowed_to_mark:
        - "Add %USERPROFILE%\\go."
        - "Add Windows VS Code extension roots."
        - "Add Windows Cursor extension roots."
        - "Add Windows Windsurf extension roots."
        - "Add Windows VSCodium extension roots."
        - "Add Windows MCP config roots, including %APPDATA%\\Claude."
        - "Keep absent root candidates non-fatal, matching macOS/Linux behavior."
        - "Add bumblebee roots --profile baseline tests for Windows default candidates."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Add the Judge-approved current-user Windows baseline roots and tests."
    allowed_files:
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/roots_windows.go"
      - "cmd/bumblebee/roots_nonwindows.go"
      - "cmd/bumblebee/main_test.go"
      - "windows.md"
    verify:
      - "go test ./..."
      - "go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
      - "./bumblebee.exe selftest"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Need to add browser roots, Windows all-users, WSL, deployment docs, endpoint identity, native ecosystem inventory, or unsupported package-manager roots."
      - "Need to change public schemas, parser behavior, sink behavior, exposure matching, CLI flags, root kinds, profile names, or emitted-record semantics."
      - "Need to guess APPDATA/LOCALAPPDATA paths when env vars are unset."
      - "Verification fails twice for unclear reasons."
    receipt:
      result: done
      changed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "cmd/bumblebee/main_test.go"
        - "windows.md"
      commands:
        - cmd: "gofmt -w cmd/bumblebee/roots.go cmd/bumblebee/roots_windows.go cmd/bumblebee/roots_nonwindows.go cmd/bumblebee/main_test.go"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "CGO_ENABLED=1 go test -race ./..."
          status: pass
        - cmd: "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added Windows APPDATA Claude as a platform baseline candidate, proved current-user Windows Go/editor/MCP baseline roots and roots preview behavior with Windows-only tests, proved absent Windows candidates are non-fatal, and updated only verified windows.md Goal 3 items."
      scope_guard:
        - "No browser roots were added."
        - "No Windows all-users, WSL, deployment docs, endpoint identity, native ecosystem inventory, or unsupported package-manager roots were added."
        - "No public schemas, parser behavior, sink behavior, exposure matching, CLI flags, root kinds, profile names, or emitted-record semantics changed."

  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and windows.md tracking after the Worker package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "T003 receipt"
      - "windows.md"
    constraints:
      - "Only update GoalBuddy control files unless T003 already updated windows.md."
      - "Do not mark Goal 4 browser items or broader Windows items."
      - "Do not claim complete Windows baseline support beyond the first current-user root slice."
    expected_output:
      - "Board state updated"
      - "Remaining Goal 3 and Windows support gaps"
    receipt:
      result: done
      summary: "Board receipts and windows.md tracking are current. Goal 3 now marks only the approved current-user Windows baseline root slice complete; browser and broader Windows items remain unchecked."
      completed_goal3_items:
        - "Add %USERPROFILE%\\go."
        - "Add Windows VS Code extension roots."
        - "Add Windows Cursor extension roots."
        - "Add Windows Windsurf extension roots."
        - "Add Windows VSCodium extension roots."
        - "Add Windows MCP config roots, including %APPDATA%\\Claude."
        - "Keep absent root candidates non-fatal, matching macOS/Linux behavior."
        - "Add bumblebee roots --profile baseline tests for Windows default candidates."
      remaining_goal3_items:
        - "Add user npm/global package locations where reliable."
        - "Add user Python locations under APPDATA, LOCALAPPDATA, and common install roots."
        - "Add pipx and virtualenv-style user package locations where reliable."
        - "Add Ruby/Bundler user package locations if present."
        - "Add Composer user/global package locations if present."
      remaining_out_of_scope_items:
        - "Goal 4 browser extension coverage."
        - "Windows all-users behavior."
        - "Windows walker hardening."
        - "Windows endpoint identity policy."
        - "Windows deployment and user-facing docs."
        - "Windows-native ecosystem scope."
        - "WSL behavior."
        - "Remaining real-profile end-to-end smoke tests."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the current-user Windows baseline-roots tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if browser roots, all-users, WSL, deployment docs, endpoint identity, native ecosystems, schema/parser/sink/exposure/CLI/root-kind/profile changes, or broad scanning leaked into scope."
      - "Reject completion if roots preview tests do not cover Windows current-user candidates and absent-candidate behavior."
      - "Reject completion if windows.md marks unverified items."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The current-user Windows baseline-roots tranche is complete. The approved Goal 3A roots are implemented or already covered by home-relative discovery, Windows tests prove inclusion, kind assignment, absent-candidate behavior, and roots preview output, and windows.md marks only verified Goal 3 items."
      prompt_to_artifact_checklist:
        - "Scout/Judge gate completed in T001/T002 before implementation."
        - "Windows candidate roots stayed behind compatibility-layer root discovery helpers."
        - "%USERPROFILE%/go and editor roots are covered by existing home-relative baseline candidates and Windows tests."
        - "%APPDATA%/Claude is added by the Windows platform baseline helper only when APPDATA is set."
        - "Tests prove expected root kinds for Go, editor extensions, and MCP config roots."
        - "Tests prove absent Windows candidates are skipped without failing root resolution."
        - "runRoots baseline preview has Windows current-user coverage."
        - "Goal 4 browser roots were not added and remain unchecked in windows.md."
        - "Forbidden schema, ecosystem, output, exposure, and main CLI surfaces had no diff in the final audit command."
        - "Verification commands passed: go test ./..., CGO_ENABLED=1 go test -race ./..., Windows build plus selftest, and git diff --check."
        - "The temporary bumblebee.exe build artifact was removed after verification."
        - "windows.md marks only the verified current-user Goal 3 items complete; npm, Python, pipx, Ruby/Bundler, Composer, and browser roots remain unchecked."
      residual_risk:
        - "Remote CI has not been observed from this local run."
        - "Remaining Goal 3 package-manager roots still need separate source-backed design and implementation."
        - "The current worktree includes earlier uncommitted Windows compatibility slices outside this tranche."

checks:
  dirty_fingerprint: "current-user Windows baseline roots plus previous Windows compatibility changes"
  last_verification:
    result: pass
    task: T003
    commands:
      - "go test ./..."
      - "CGO_ENABLED=1 go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
      - "git diff --check"
