        - "Windows absent-candidate behavior for missing Chrome/Edge browser roots."
        - "Explicit classifyRoot coverage for Windows Chrome/Edge Extensions paths."
        - "runRoots --profile baseline Windows preview coverage for Chrome/Edge roots."
        - "Negative assertions that browser parent/profile/sensitive paths are not emitted as roots."
