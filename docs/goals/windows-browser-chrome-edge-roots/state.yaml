# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Chrome/Edge Browser Roots"
  slug: "windows-browser-chrome-edge-roots"
  kind: existing_plan
  tranche: "Add the first Windows browser-extension baseline roots for Chrome and Edge only."
  status: done
  oracle:
    signal: "Tests and redacted Windows smoke prove Chrome/Edge browser extension roots resolve as browser_extension_root without scanning browser profile parents or sensitive browser data."
    cadence: "after Scout/Judge gate, after Worker implementation, and at final audit"
    final_proof: "Passing Go verification, passing Windows smoke harness, and a Judge receipt mapping windows.md Goal 4/12 checkbox changes to proven Chrome/Edge behavior."
  intake:
    original_request: "Prepare GoalBuddy for Goal 4A: Windows Chrome/Edge browser extension roots."
    interpreted_outcome: "A runnable GoalBuddy board exists for adding safe Chrome/Edge Windows browser extension roots as a compatibility-layer slice."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and Windows endpoint operators"
    authority: requested
    proof_type: test
    completion_proof: "Windows root resolution tests, roots CLI tests, full Go verification, and the redacted Windows smoke summary prove the Chrome/Edge slice."
    likely_misfire: "Adding all browser families, scanning parent browser profile directories, or changing parser/schema/CLI behavior while trying to complete only Chrome/Edge root discovery."
    blind_spots_considered:
      - "Browser profile parents contain sensitive data such as Cookies, Login Data, History, Local Storage, IndexedDB, and cache."
      - "Firefox-family roots have a different parent-profile shape and should remain a separate slice."
      - "The redacted smoke harness currently fails if browser roots appear; it must be updated in the same Worker slice."
      - "This machine has Chrome and Edge Default Extensions directories, so a real smoke can prove the slice."
      - "Existing dirty worktree includes previous Windows slices; do not revert unrelated changes."
    existing_plan_facts:
      - "Add Chrome roots under %LOCALAPPDATA%\\Google\\Chrome\\User Data."
      - "Add Edge roots under %LOCALAPPDATA%\\Microsoft\\Edge\\User Data."
      - "Use only Default and Profile 1 through Profile 9."
      - "Point directly at per-profile Extensions directories."
      - "Keep Brave, Chromium, Vivaldi, Firefox, LibreWolf, and Waterfox out of this slice."
      - "Update scripts/windows-smoke.ps1 with redacted browser counts/booleans."
      - "Update windows.md only for proven Goal 4A and Goal 12 items."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-browser-chrome-edge-roots/"
    command: "npx goalbuddy board docs/goals/windows-browser-chrome-edge-roots"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

