    task: T003
    commands:
      - "gofmt -w cmd\\bumblebee\\roots.go cmd\\bumblebee\\main_test.go internal\\ecosystem\\browserext\\browserext_test.go"
      - "go test -count=1 ./cmd/bumblebee ./internal/ecosystem/browserext ./internal/scanner"
