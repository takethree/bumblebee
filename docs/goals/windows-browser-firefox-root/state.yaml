# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Firefox Browser Root"
  slug: "windows-browser-firefox-root"
  kind: existing_plan
  tranche: "Add Windows Firefox browser-extension baseline root coverage only."
  status: done
  oracle:
    signal: "Tests and redacted Windows smoke prove Firefox profile root resolves as browser_extension_root and scans extensions.json without adding sensitive Firefox profile data roots."
    cadence: "after Scout/Judge gate, after Worker implementation, and at final audit"
    final_proof: "Passing Go verification, passing Windows smoke harness, and a Judge receipt mapping windows.md Goal 4/12 checkbox changes to proven Firefox behavior."
  intake:
    original_request: "Prepare GoalBuddy for Goal 4B: Windows Firefox browser root coverage."
    interpreted_outcome: "A runnable GoalBuddy board exists for adding safe Windows Firefox profile-root coverage as a compatibility-layer slice."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and Windows endpoint operators"
    authority: requested
    proof_type: test
    completion_proof: "Windows root tests, parser/dispatch tests, full Go verification, and the redacted Windows smoke summary prove the Firefox slice."
    likely_misfire: "Adding broad Firefox profile data roots, LibreWolf/Waterfox, remaining Chromium browsers, parser/schema/CLI behavior, or claiming real smoke without redacted evidence."
    blind_spots_considered:
      - "Firefox root shape differs from Chromium: profile parent is needed so per-profile extensions.json is reachable."
      - "Firefox profiles can contain cookies.sqlite, places.sqlite, storage, cache2, sessionstore files, and extension source/XPI files that must not become roots."
      - "Local evidence indicates Firefox Profiles exists and one profile has extensions.json, so real smoke should prove this slice."
      - "LibreWolf and Waterfox Windows layouts are not proven in this tranche."
      - "Existing dirty worktree includes previous Windows slices; do not revert unrelated changes."
    existing_plan_facts:
      - "Add Firefox root under %APPDATA%\\Mozilla\\Firefox\\Profiles."
      - "Use APPDATA only; do not guess if unset."
      - "Use the existing browserext Firefox extensions.json parser."
      - "Update scripts/windows-smoke.ps1 with redacted Firefox aggregate fields."
      - "Update windows.md only for proven Firefox Goal 4/12 items."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-browser-firefox-root/"
    command: "npx goalbuddy board docs/goals/windows-browser-firefox-root"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Validate the exact Firefox root discovery surface and test/smoke evidence needed for Goal 4B."
    inputs:
      - "docs/goals/windows-browser-firefox-root/goal.md"
      - "windows.md"
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/main_test.go"
      - "scripts/windows-smoke.ps1"
      - "internal/ecosystem/browserext"
      - "internal/scanner/scanner.go"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not inspect raw Firefox add-on details or raw scan NDJSON unless needed as aggregate smoke evidence."
      - "Keep Brave, Chromium, Vivaldi, LibreWolf, Waterfox, all-users, WSL, package-manager roots, native Windows ecosystems, docs, parser/schema/CLI changes out of the recommended Worker package."
    expected_output:
      - "Current Firefox root/parser/dispatch map"
      - "Windows Firefox candidate root list"
      - "Sensitive Firefox paths that must not become roots"
      - "Tests to add or update"
      - "Smoke harness update requirements"
      - "Recommended Worker package"
    receipt:
      result: done
      summary: "Windows Firefox coverage is a bounded root-discovery slice: add %APPDATA%\\Mozilla\\Firefox\\Profiles as browser_extension_root, keep parser/dispatch unchanged, and add redacted smoke aggregate fields."
      evidence:
        - "cmd/bumblebee/roots.go already classifies /Firefox/Profiles as browser_extension_root; Windows candidate roots currently include only Chrome and Edge."
        - "internal/scanner/scanner.go dispatches files named extensions.json through browserext.IsFirefoxExtensionsJSON before ScanFirefoxExtensions."
        - "internal/ecosystem/browserext already recognizes Firefox-family extensions.json paths after filepath.ToSlash normalization."
        - "Local aggregate probe: firefox_profiles_exists=true, firefox_profile_count=2, firefox_extensions_json_profile_count=1."
      sensitive_paths_not_roots:
        - "cache2"
        - "cookies.sqlite"
        - "places.sqlite"
        - "storage"
        - "sessionstore-backups"
        - "per-extension XPI/source directories"
      recommended_worker_package:
        - "Add the APPDATA Firefox Profiles root only when APPDATA is set and the directory exists after normal root filtering."
        - "Extend Windows root/classification tests and Firefox extensions.json path test."
        - "Add smoke fields for Firefox Profiles listed/existing and aggregate profile/extensions.json counts."
        - "Mark only the Firefox Goal 4 item and matching smoke receipt in windows.md."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve the exact Worker package for the Windows Firefox root slice."
    inputs:
      - "T001 receipt"
      - "windows.md"
      - "Current dirty diff"
    constraints:
      - "Read-only."
      - "Reject Firefox cache/cookies/history/storage/session roots, LibreWolf, Waterfox, all-users, WSL, native ecosystems, package-manager roots, parser/schema/sink/exposure/CLI/profile/root-kind changes."
      - "Approve only the largest safe useful Firefox root discovery slice."
    expected_output:
      - "Decision: approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "windows.md checkboxes allowed to mark"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      exact_worker_objective: "Implement Windows Firefox profile-parent root discovery as a compatibility-layer slice, with tests, redacted smoke aggregates, and only proven windows.md checkbox/evidence updates."
      allowed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/main_test.go"
        - "internal/ecosystem/browserext/browserext_test.go"
        - "scripts/windows-smoke.ps1"
        - "windows.md"
      verify_commands:
        - "gofmt -w cmd/bumblebee/roots.go cmd/bumblebee/main_test.go internal/ecosystem/browserext/browserext_test.go"
        - "go test -count=1 ./cmd/bumblebee ./internal/ecosystem/browserext ./internal/scanner"
        - "go test ./..."
        - "CGO_ENABLED=1 go test -race ./..."
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check"
      windows_md_allowed_changes:
        - "Check Goal 4 Firefox profile roots only after tests and smoke prove it."
        - "Add a Firefox smoke receipt with aggregate counts only."
      rejected_scope:
        - "Brave, Chromium, Vivaldi, LibreWolf, Waterfox, all-users, WSL, native package ecosystems, parser/schema/CLI/sink/root-kind changes, and sensitive Firefox profile-data roots."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Execute the Judge-approved Windows Firefox root discovery slice."
    allowed_files:
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/main_test.go"
      - "internal/ecosystem/browserext/browserext_test.go"
      - "scripts/windows-smoke.ps1"
      - "windows.md"
    verify:
      - "gofmt -w cmd/bumblebee/roots.go cmd/bumblebee/main_test.go internal/ecosystem/browserext/browserext_test.go"
      - "go test -count=1 ./cmd/bumblebee ./internal/ecosystem/browserext ./internal/scanner"
      - "go test ./..."
      - "CGO_ENABLED=1 go test -race ./..."
      - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Need to add Brave, Chromium, Vivaldi, LibreWolf, Waterfox, all-users, WSL, package-manager roots, native Windows ecosystems, deployment docs, or endpoint identity."
      - "Need to add Firefox cache, cookies, places/history, storage, session, extension source/XPI, or other sensitive profile data roots."
      - "Need parser/schema/sink/exposure/CLI/profile/root-kind/emitted-record semantic changes."
      - "Verification fails twice for unclear reasons."
    receipt:
      result: done
      changed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/main_test.go"
        - "internal/ecosystem/browserext/browserext_test.go"
        - "scripts/windows-smoke.ps1"
        - "windows.md"
      summary: "Added Windows Firefox Profiles root discovery under APPDATA, tests for Windows Firefox classification/root privacy boundaries, redacted Firefox smoke aggregate fields, and a proven windows.md Firefox receipt."
      commands:
        - cmd: "gofmt -w cmd\\bumblebee\\roots.go cmd\\bumblebee\\main_test.go internal\\ecosystem\\browserext\\browserext_test.go"
          status: pass
        - cmd: "go test -count=1 ./cmd/bumblebee ./internal/ecosystem/browserext ./internal/scanner"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "CGO_ENABLED=1 go test -race ./..."
          status: pass
          note: "Used official go1.26.3 windows-amd64 archive from go.dev with SHA-256 verification and existing F:\\msys64\\ucrt64\\bin\\gcc.exe."
        - cmd: "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
          status: pass
          evidence: "C:\\Users\\bbutner\\AppData\\Local\\Temp\\bumblebee-windows-smoke\\20260524-130806\\smoke-summary.redacted.json"
        - cmd: "git diff --check"
          status: pass
          note: "Exit code 0 with LF-to-CRLF warnings only."
      smoke_summary:
        root_count: 9
        browser_root_count: 3
        firefox_profiles_exists: true
        firefox_profiles_listed: true
        firefox_profile_count: 2
        firefox_extensions_json_profile_count: 1
        scan_summary_status: complete
        package_records: 1042
      scope_guard:
        - "No LibreWolf/Waterfox/Brave/Chromium/Vivaldi/all-users/WSL/native package scope added."
        - "No Firefox cache, cookies, places/history, storage, session, or per-extension source roots added."

  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and windows.md tracking after the Worker package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "T003 receipt"
      - "windows.md"
    constraints:
      - "Only update GoalBuddy control files unless T003 already updated windows.md."
      - "Do not mark LibreWolf/Waterfox, remaining Chromium browser families, or broader Windows items."
    expected_output:
      - "Board state updated"
      - "Remaining Goal 4 and Goal 12 gaps"
    receipt:
      result: done
      summary: "Board and windows.md tracking refreshed after the Firefox Worker slice."
      windows_md_updates:
        - "Goal 4 Firefox profile roots checkbox is checked."
        - "Firefox smoke receipt records aggregate root/profile/count evidence from 2026-05-24."
      remaining_goal_4_gaps:
        - "Brave profile extension roots"
        - "Chromium profile extension roots"
        - "Vivaldi profile extension roots"
        - "LibreWolf and Waterfox Windows profile roots"
      remaining_goal_12_gaps:
        - "HTTP sink smoke test against a local endpoint"
        - "Capture known limitations before declaring Windows support complete"

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the Windows Firefox root tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if sensitive Firefox paths or non-Firefox browser families leaked into scope."
      - "Reject completion if windows.md marks unverified items."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The Windows Firefox root tranche satisfies the oracle: baseline resolves the Firefox Profiles root, scanner/parser dispatch remains the existing extensions.json path, sensitive Firefox profile children are not roots, smoke proof is redacted and complete, and windows.md marks only the proven Firefox item."
      evidence:
        - "cmd/bumblebee/roots.go adds only %APPDATA%\\Mozilla\\Firefox\\Profiles for runtime.GOOS=windows when APPDATA is set."
        - "cmd/bumblebee/main_test.go covers Windows Firefox root inclusion, absent-candidate filtering, classification, and sensitive profile children not becoming roots."
        - "internal/ecosystem/browserext/browserext_test.go covers a Windows-shaped Firefox extensions.json path."
        - "scripts/windows-smoke.ps1 emits only aggregate Firefox fields."
        - "windows.md keeps LibreWolf/Waterfox unchecked and records aggregate Firefox smoke evidence."
      missing_evidence: []
      next_task: null

