# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Browser Roots"
  slug: "windows-browser-roots"
  kind: existing_plan
  tranche: "Implement and validate remaining Windows browser-extension roots for Brave, Chromium, Vivaldi, LibreWolf, and Waterfox."
  status: done
  oracle:
    signal: "windows.md Goal 4 has the remaining browser-family items closed or explicitly deferred with evidence, and Windows smoke proves the implemented roots without broad browser-profile scanning."
    cadence: "after source/layout validation, after install validation, after implementation, and at final audit"
    final_proof: "Task receipts list official-source validation, install/run-once evidence, changed files, focused tests, full tests, Windows smoke, and diff hygiene."
  intake:
    original_request: "$goalbuddy:goal-prep for the approved remaining Windows browser roots plan."
    interpreted_outcome: "Prepare a GoalBuddy board to install/validate official browser layouts, then implement reliable Windows browser-extension roots as a compatibility-layer slice."
    input_shape: existing_plan
    audience: "TakeThree Windows compatibility fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "Implementation, source/install receipts, docs, smoke receipts, and final audit prove the browser-root slice works and stays within compatibility-layer boundaries."
    likely_misfire: "Adding broad browser profile directories or claiming support from fixture tests alone without proving official Windows install layouts."
    blind_spots_considered:
      - "Chromium snapshots are not the same risk profile as normal signed stable installers."
      - "Fresh real browser profiles may not contain extension records; fixture scans must prove data emission."
      - "Real profile evidence must stay redacted and outside the repo."
      - "Waterfox path reliability must be observed before closing the checklist item."
      - "Sensitive browser profile skipping must continue to win over broad traversal."
    existing_plan_facts:
      - "Keep browsers installed after validation."
      - "Use an official Chromium snapshot for Chromium validation."
      - "Do not use third-party download sites."
      - "Do not sign in, sync, import data, set defaults, or install external extensions."
      - "Implement root discovery only; no schema changes, browser APIs, or command-output inventory."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41738/"
    command: "node C:\\Users\\bbutner\\AppData\\Roaming\\npm\\node_modules\\goalbuddy\\goalbuddy\\extend\\local-goal-board\\scripts\\local-goal-board.mjs --goal docs/goals/windows-browser-roots --host goalbuddy.localhost --port 41738"

active_task: null

