          integrity_strategy: "Download from brave.com; verify Authenticode publisher before running. Brave support docs also identify the Windows User Data location under %LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data."
          expected_profile_root: "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data"
          current_root_exists: false
        - browser: "Vivaldi"
