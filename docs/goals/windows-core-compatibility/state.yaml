# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Core Compatibility"
  slug: "windows-core-compatibility"
  kind: existing_plan
  tranche: "Implement the core Windows compatibility layer: Windows build, selftest, explicit-root scans, schema-compatible output, and tracking updates."
  status: done
  oracle:
    signal: "Windows-compatible bumblebee.exe builds, passes selftest, scans explicit Windows roots read-only, and emits schema-compatible NDJSON ending in scan_summary.status=complete."
    cadence: "after the Worker package and at final audit"
    final_proof: "Passing verification commands plus a Judge/PM receipt mapping changed files and windows.md checkboxes to the core requirement."
  intake:
    original_request: "Come up with a plan for the core implementation work, then prepare it with GoalBuddy."
    interpreted_outcome: "A runnable GoalBuddy board exists for implementing the core Windows compatibility layer without widening into full Windows baseline support."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and Windows scanner operators"
    authority: requested
    proof_type: test
    completion_proof: "Windows CI/build/selftest and explicit-root scan tests pass; windows.md marks only verified core items complete."
    likely_misfire: "Implementing broad Windows baseline defaults, all-users scanning, WSL, deployment docs, or Windows-native ecosystems before the core explicit-root compatibility layer is proven."
    blind_spots_considered:
      - "CI shell differences between Linux/macOS and Windows."
      - "GoReleaser archive behavior for Windows."
      - "Windows path separators in tests and emitted paths."
      - "Broad-home detection on C:\\Users-style paths."
      - "Access-denied behavior should remain diagnostic, not scan-fatal."
      - "Avoid schema/parser divergence from upstream."
    existing_plan_facts:
      - "Keep Windows support as an upstream-friendly compatibility layer."
      - "Core requirement is explicit-root Windows scans, not baseline defaults."
      - "Do not change public schema, ecosystems, root kinds, profiles, or CLI flags."
      - "Add Windows CI/release support."
      - "Add or adjust tests for explicit Windows roots and scan_summary output."
      - "Update windows.md only for verified core progress."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-core-compatibility/"
    command: "npx goalbuddy board docs/goals/windows-core-compatibility"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the existing Windows core compatibility plan against repo facts and approve or narrow the Worker package."
    inputs:
      - "docs/goals/windows-core-compatibility/goal.md"
      - "windows.md"
      - "Proposed core plan from chat"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/main_test.go"
      - "internal/scanner/*_test.go"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve the compatibility-layer boundary."
      - "Reject any task that widens into baseline defaults, all-users, WSL, deployment docs, or Windows-native ecosystems."
    expected_output:
      - "Decision: approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Any deferred follow-up tasks"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The existing plan is bounded to the core compatibility layer: Windows CI/release support, explicit-root tests/fixes, schema-compatible output, and windows.md tracking. It explicitly defers baseline defaults, all-users, WSL, deployment docs, and Windows-native ecosystems."
      worker_task: T002
      allowed_files:
        - ".github/workflows/ci.yml"
        - ".goreleaser.yaml"
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/main_test.go"
        - "internal/scanner/scanner_test.go"
        - "internal/scanner/scanner_integration_test.go"
        - "windows.md"
      verify:
        - "go test ./..."
        - "go test -race ./..."
        - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
        - "./bumblebee.exe selftest"

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement the approved core Windows compatibility package: Windows CI/release support, explicit-root Windows tests/fixes, and verified windows.md checklist updates."
    allowed_files:
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/main_test.go"
      - "internal/scanner/scanner_test.go"
      - "internal/scanner/scanner_integration_test.go"
      - "windows.md"
    verify:
      - "go test ./..."
      - "go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
      - "./bumblebee.exe selftest"
    stop_if:
      - "Need files outside allowed_files."
      - "Need to change public schema, ecosystem names, profile names, root kinds, or CLI flags."
      - "Need to implement Windows baseline defaults, all-users, WSL, deployment docs, or Windows-native ecosystems."
      - "Go is unavailable locally and no CI-equivalent verification can be run."
      - "Verification fails twice for unclear reasons."
    receipt:
      result: done
      changed_files:
        - ".github/workflows/ci.yml"
        - ".goreleaser.yaml"
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/main_test.go"
        - "internal/scanner/scanner_test.go"
        - "windows.md"
      commands:
        - cmd: "Downloaded Go 1.25.10 Windows amd64 zip from go.dev and verified SHA256 ca37af2dadd8544464f1a9ca7c3886499d1cdfcb263855d0a1d71f194b2bd222."
          status: pass
        - cmd: "Downloaded MSYS2 20260322 self-extracting archive from repo.msys2.org and verified GPG signature against documented fingerprint 0EBF 782C 5D53 F7E5 FB02 A667 46BD 761F 7A49 B0EC."
          status: pass
        - cmd: "Installed mingw-w64-ucrt-x86_64-gcc via MSYS2 pacman; gcc.exe reports Rev5 Built by MSYS2 project 16.1.0."
          status: pass
        - cmd: "gofmt -w cmd/bumblebee/roots.go cmd/bumblebee/main_test.go internal/scanner/scanner_test.go"
          status: pass
        - cmd: "go vet ./..."
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "CGO_ENABLED=1 go test -race ./..."
          status: pass
        - cmd: "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added Windows CI/release coverage with MSYS2 GCC for race tests, added Windows-aware home-root handling, added explicit project/deep root scan-summary tests over paths with spaces, made path assertions Windows-safe, and updated windows.md core checkboxes."

  - id: T003
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and tracking after the Worker package, including any verifier limitations."
    inputs:
      - "T002 receipt"
      - "windows.md"
    constraints:
      - "Only update GoalBuddy control files unless T002 already updated windows.md."
      - "Do not claim checkboxes complete without proof."
    expected_output:
      - "Board state updated"
      - "Remaining core gaps if any"
    receipt:
      result: done
      summary: "windows.md was updated only for verified core progress. Baseline defaults, browser defaults, multi-user scanning, endpoint identity normalization, deployment docs, WSL, Windows-native ecosystem scope, and unsupported record-id drift analysis remain unchecked."
      remaining_core_gaps:
        - "Remote GitHub Actions jobs have not run in this local session."
        - "The record-ID path separator drift checkbox remains unchecked because the core test validates non-empty stable Windows records but does not prove cross-OS ID equivalence."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the core Windows compatibility tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if the only evidence is planning or file edits without verification."
      - "Reject completion if scope widened beyond the core compatibility layer without explicit approval."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      evidence:
        - "Windows CI/release support is represented in .github/workflows/ci.yml and .goreleaser.yaml: windows-latest, MSYS2 GCC, go test, race test, build/selftest, windows goos, .exe, and zip archive handling."
        - "A local Windows build produced bumblebee.exe and selftest completed successfully."
        - "Explicit-root scan behavior is covered by TestRunScanExplicitRootWithSpacesEmitsSummary for project and deep profiles, including paths with spaces, package records, root_kind, source_file, project_path, and terminal scan_summary."
        - "Windows broad-home detection is covered by updated root-expansion tests using Windows-style home environment variables."
        - "Scanner path/error tests were kept cross-platform without changing public schema, profile names, root kinds, ecosystem names, parser behavior, or CLI flags."
        - "windows.md marks only verified core items complete; baseline defaults, all-users scanning, WSL, deployment docs, Windows-native ecosystems, and record-ID drift analysis remain unchecked."
      verification:
        - "go vet ./..."
        - "go test ./..."
        - "CGO_ENABLED=1 go test -race ./..."
        - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
        - "git diff --check"
        - "node .../check-goal-state.mjs docs/goals/windows-core-compatibility/state.yaml"
      residual_risk:
        - "Remote GitHub Actions jobs have not run in this local session; the workflow has been configured and local Windows-equivalent verification passed."
        - "Cross-OS record-ID separator drift has not been proven and remains an unchecked follow-up in windows.md."
      next_scope:
        - "Minimum supported Windows version documentation."
        - "Record-ID drift analysis."
        - "Windows baseline roots, browser roots, multi-user behavior, endpoint identity docs, deployment docs, WSL policy, and Windows-native ecosystem decisions."

checks:
  dirty_fingerprint: "modified core files plus untracked docs/goals and windows.md"
  last_verification:
    result: pass
    task: T999
    commands:
      - "go vet ./..."
      - "go test ./..."
      - "CGO_ENABLED=1 go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
      - "git diff --check"
