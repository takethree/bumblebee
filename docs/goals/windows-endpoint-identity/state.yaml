        - "Need automatic Windows machine identifier collection."
        - "Need README or broad user-facing support-doc changes."
        - "Need parser, scanner, sink, root-discovery, or record_id changes."
        - "Verification fails twice for the same reason."
      wording_constraints:
        - "State that Windows endpoint.uid is the Go-provided Windows user SID for the scanner process when user lookup succeeds."
        - "State that endpoint.username is scanner-process identity and Windows account shape varies by account provider."
        - "State that endpoint.device_id remains the stable machine correlation key and is supplied through --device-id-env."
        - "Recommend operator-provisioned MDM/RMM/EDR/Entra/Intune asset IDs and do not recommend automatic MachineGuid or SMBIOS collection."
        - "Leave local, domain, and Azure AD username shape as partly verified unless live evidence covers all three."
      rationale: "This is the largest safe compatibility-layer slice: it fixes the Windows fake uid fallback risk, documents Windows identity semantics, and verifies behavior without changing schema or collecting device fingerprints."

