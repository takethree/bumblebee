# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Goal 7 Endpoint Username Validation"
  slug: "windows-endpoint-username-validation"
  kind: existing_plan
  tranche: "Validate Windows endpoint.username as redacted scanner-process identity evidence without changing endpoint semantics."
  status: done
  oracle:
    signal: "Windows smoke records redacted username-shape evidence, endpoint username is present and consistent across package and scan_summary records, docs preserve scanner-process identity semantics, and windows.md does not overclaim untested local/domain/Azure AD host coverage."
    cadence: "after Scout evidence mapping, after Worker implementation, and at final audit"
    final_proof: "Receipts list source validation, changed files, endpoint/smoke tests, full tests, Windows smoke, git diff --check, and final audit with full_outcome_complete=true."
  intake:
    original_request: "$goalbuddy:goal-prep for Goal 7 endpoint.username validation using the non-invasive approach."
    interpreted_outcome: "Prepare a GoalBuddy board to validate Windows endpoint.username behavior as scanner-process identity, add redacted smoke evidence, and avoid overclaiming untested account-provider shapes."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: test
    completion_proof: "Source validation, redacted Windows smoke evidence, focused endpoint tests, full go test ./..., docs updates, git diff --check, and final audit prove the tranche is complete."
    likely_misfire: "Creating accounts, reading Windows identity stores, normalizing username shapes, treating username as a stable endpoint key, writing raw identity values into docs, or closing provider-specific host validation without evidence."
    blind_spots_considered:
      - "Current host appears to provide a qualified scanner-process username, but that does not prove every provider shape."
      - "Local-account and Azure AD live-host validation may be unavailable."
      - "Package records and scan_summary must preserve the same endpoint identity."
      - "Redacted receipts must avoid raw username, SID, hostname, token, HTTP payload, and profile path leakage."
    existing_plan_facts:
      - "Chosen validation depth is Non-invasive."
      - "Do not create temporary Windows users."
      - "Preserve endpoint JSON shape and current os/user.Current behavior."
      - "Keep endpoint.device_id as the preferred stable endpoint key."
      - "Split or leave explicit provider-specific follow-up evidence if unavailable."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-endpoint-username-validation"
    last_error: "npx goalbuddy board exited without generating .goalbuddy-board; fetch of https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json returned HTTP 404."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map current endpoint.username implementation, docs, tests, and smoke evidence before edits."
    inputs:
      - "docs/goals/windows-endpoint-username-validation/goal.md"
      - "windows.md Goal 7 and endpoint identity boundary"
      - "internal/endpoint implementation and Windows tests"
      - "scripts/windows-smoke.ps1"
      - "docs/state-model.md"
      - "docs/deployment-windows.md"
      - "README.md Windows troubleshooting"
    constraints:
      - "Read-only."
      - "Do not edit implementation or docs."
      - "Do not create users, run identity-store discovery, inspect registry/Entra/domain state, or write raw identity values into notes."
    expected_output:
      - "Current username behavior and docs alignment."
      - "Exact smoke evidence gaps."
      - "Allowed files and verification commands for Worker."
      - "Provider-specific live-host evidence that remains unavailable, if any."
    receipt:
      result: done
      summary: "Endpoint identity already uses Go os/user.Current() directly. Go documents Windows User.Uid as a SID and Username as the login name. Existing docs correctly describe username/uid as scanner-process identity and device_id as the stable endpoint key, but windows.md still leaves provider-shape validation open and smoke lacks redacted username-shape/consistency counters."
      evidence:
        - "internal/endpoint/endpoint.go: Current() assigns endpoint.Username from user.Current().Username and endpoint.UID from user.Current().Uid."
        - "internal/endpoint/uid_windows.go: fallback UID is intentionally empty on Windows."
        - "go doc os/user.User: Windows Uid is a SID string; Username is the login name."
        - "internal/endpoint/endpoint_windows_test.go already asserts username is present and UID is Windows-SID-shaped."
        - "docs/state-model.md and docs/deployment-windows.md say username/uid identify the scanner process and device_id is preferred for stable endpoint identity."
        - "scripts/windows-smoke.ps1 does not yet record redacted endpoint username shape or endpoint consistency across package and scan_summary records."
      needed_updates:
        - "Add smoke redacted username shape/presence/consistency/SID/device_id counters."
        - "Fail smoke if endpoint username is missing or inconsistent across baseline records."
        - "Update windows.md Goal 7 to distinguish evidence-backed scanner-process validation from unavailable local/Azure AD host validation."
        - "Keep raw identity values out of tracked docs."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: medium
    objective: "Validate the non-invasive Goal 7 implementation slice and choose allowed files."
    inputs:
      - "T001 Scout receipt"
      - "Goal oracle"
      - "Chosen Non-invasive policy"
    constraints:
      - "Do not implement."
      - "Reject any plan that changes endpoint schema, normalizes usernames, creates Windows users, reads identity stores, or writes raw identity values into tracked docs."
    expected_output:
      - "approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: approved
      summary: "Approve one non-invasive Worker slice: add redacted endpoint username shape and consistency counters to Windows smoke, tighten endpoint documentation/Goal 7 receipt language, and add only stable endpoint tests. Do not change endpoint schema or username semantics."
      exact_worker_objective: "Implement non-invasive endpoint.username validation smoke/docs/tests without raw identity leakage or provider overclaiming."
      allowed_files:
        - "windows.md"
        - "README.md"
        - "docs/state-model.md"
        - "docs/deployment-windows.md"
        - "internal/endpoint/endpoint_windows_test.go"
        - "scripts/windows-smoke.ps1"
        - "docs/goals/windows-endpoint-username-validation/state.yaml"
      verify:
        - "go test ./internal/endpoint"
        - "go test ./cmd/bumblebee ./internal/endpoint ./internal/model"
        - "go test ./..."
        - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check"
      stop_if:
        - "Need files outside allowed_files."
        - "Need endpoint schema changes, username normalization, Windows user creation, registry reads, Entra/domain/Intune APIs, MachineGuid/SMBIOS/hardware identifiers, raw identity docs, or unstable provider-specific claims."
        - "Verification fails twice for the same reason."
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement the approved non-invasive endpoint.username validation docs, tests, and smoke receipt coverage."
    allowed_files:
      - "windows.md"
      - "README.md"
      - "docs/state-model.md"
      - "docs/deployment-windows.md"
      - "internal/endpoint/endpoint_windows_test.go"
      - "scripts/windows-smoke.ps1"
      - "docs/goals/windows-endpoint-username-validation/state.yaml"
    verify:
      - "go test ./internal/endpoint"
      - "go test ./cmd/bumblebee ./internal/endpoint ./internal/model"
      - "go test ./..."
      - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Need endpoint schema changes, username normalization, Windows user creation, registry reads, Entra/domain/Intune APIs, MachineGuid/SMBIOS/hardware identifiers, raw identity docs, or unstable provider-specific claims."
      - "Verification fails twice for the same reason."
    receipt:
      result: done
      changed_files:
        - "windows.md"
        - "docs/state-model.md"
        - "docs/deployment-windows.md"
        - "scripts/windows-smoke.ps1"
        - "docs/goals/windows-endpoint-username-validation/state.yaml"
      summary: "Implemented non-invasive endpoint.username validation. Windows smoke now supplies device_id through --device-id-env, fails if baseline records lack endpoint objects, username, package/scan_summary consistency, Windows-SID-shaped uid, or matching device_id, and writes only redacted endpoint aggregate fields. Docs now treat endpoint.username as opaque scanner-process context and keep live local-account/Azure AD representative-host validation open."
      redacted_smoke_evidence:
        evidence_location: "outside-repo smoke-summary.redacted.json for run 20260525-203431"
        endpoint_record_count: 4036
        endpoint_package_record_count: 4035
        endpoint_scan_summary_record_count: 1
        endpoint_username_present: true
        endpoint_username_shape: "qualified"
        endpoint_username_consistent_across_records: true
        endpoint_uid_windows_sid_shape: true
        endpoint_device_id_present_when_env_supplied: true
      commands:
        - cmd: "PowerShell parser check for scripts\\windows-smoke.ps1"
          status: pass
        - cmd: "go test ./internal/endpoint"
          status: pass
        - cmd: "go test ./cmd/bumblebee ./internal/endpoint ./internal/model"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
          status: pass
        - cmd: "rg redaction scan for raw local username/SID/hostname/profile path patterns in touched docs and state"
          status: pass
        - cmd: "git diff --check"
          status: pass
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether Goal 7 endpoint.username validation is complete for the non-invasive tranche."
    inputs:
      - "All task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Goal oracle"
    constraints:
      - "Do not implement."
      - "Reject completion if raw usernames/SIDs/hostnames are written into tracked docs."
      - "Reject completion if docs imply username is a stable endpoint key."
      - "Reject completion if smoke does not prove redacted username presence and consistency."
      - "Reject completion if any required Worker task is still queued or active."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The non-invasive Goal 7 tranche is complete. The implementation keeps endpoint schema and os/user semantics unchanged, adds redacted smoke proof for endpoint.username presence, shape class, package/scan_summary consistency, Windows-SID-shaped uid, and supplied device_id, and updates docs to treat username as opaque scanner-process context. Representative live local-account and Azure AD host validation remains explicitly open rather than overclaimed."
      completion_evidence:
        - "T001 validated current endpoint implementation and docs source behavior."
        - "T002 approved the bounded non-invasive Worker scope and stop rules."
        - "T003 implemented smoke/docs updates within allowed files."
        - "Required Go tests, full go test ./..., Windows smoke, redaction scan, and git diff --check passed."
      requirement_audit:
        endpoint_schema_unchanged: "proved by no Go model/endpoint implementation changes in this Worker diff"
        username_semantics_unchanged: "proved by docs and smoke only; no endpoint normalization or provider discovery was added"
        redacted_smoke_evidence: "proved by T003 redacted_smoke_evidence and successful smoke run"
        no_raw_identity_in_tracked_receipts: "proved by rg redaction scan over touched docs, smoke script, and state"
        no_provider_overclaim: "proved by windows.md and docs keeping local-account/Azure AD representative-host validation open"
        device_id_boundary_preserved: "proved by docs continuing to require operator-supplied --device-id-env and smoke validating supplied value"
