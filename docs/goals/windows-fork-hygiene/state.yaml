# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Fork Hygiene"
  slug: "windows-fork-hygiene"
  kind: existing_plan
  tranche: "Audit and, if needed, isolate Windows-specific compatibility helpers before adding baseline roots."
  status: done
  oracle:
    signal: "Current Windows changes are mapped to compatibility-layer boundaries, any helper refactor is behavior-neutral, windows.md Goal 13 reflects only proven facts, and verification commands pass."
    cadence: "after Scout audit, after Worker package if any, and at final audit"
    final_proof: "Passing verification plus a Judge receipt proving no scope leaked into baseline roots, browser roots, schemas, parsers, sinks, CLI, root kinds, profiles, WSL, deployment docs, endpoint identity, or native ecosystems."
  intake:
    original_request: "Prepare the next careful windows.md tranche with GoalBuddy after the fork hygiene plan."
    interpreted_outcome: "A runnable GoalBuddy board exists for the Goal 13 fork hygiene boundary pass."
    input_shape: existing_plan
    audience: "Bumblebee maintainers who need a Windows compatibility fork that remains upstream-friendly"
    authority: requested
    proof_type: test
    completion_proof: "Read-only audit, bounded behavior-neutral refactor if needed, windows.md Goal 13 evidence updates, and full verification pass."
    likely_misfire: "Starting Goal 3 baseline-root discovery or broad Windows feature work under the banner of hygiene."
    blind_spots_considered:
      - "There is already a dirty worktree from prior Windows slices."
      - "Some Windows logic may be acceptable as narrow runtime.GOOS branches; not every branch requires a new file."
      - "A behavior-neutral refactor can still accidentally change root classification or home detection."
      - "windows.md Goal 13 includes process items, like commits/rebase/upstream PRs, that should remain unchecked unless actually done."
      - "Tests must prove behavior did not change after helper isolation."
    existing_plan_facts:
      - "Run a read-only audit of current Windows diff boundaries first."
      - "Refactor only Windows-specific root/home helpers if the Judge approves it."
      - "Do not add any new inventory coverage."
      - "Update windows.md only for proven Goal 13 progress."
      - "Run go test, race tests, Windows build/selftest, and git diff --check."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-fork-hygiene/"
    command: "npx goalbuddy board docs/goals/windows-fork-hygiene"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the current Windows-related dirty diff to shared surfaces, platform-specific surfaces, and Goal 13 checklist evidence."
    inputs:
      - "windows.md"
      - "git diff --name-only"
      - "git diff --stat"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/main_test.go"
      - "docs/state-model.md"
      - "internal/model/model.go"
      - "internal/model/model_test.go"
      - "internal/scanner/scanner_test.go"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not inspect outside the repo unless the Judge later asks for it."
      - "Classify evidence without marking checklist items."
    expected_output:
      - "Current dirty diff map"
      - "Shared surfaces touched"
      - "Platform-specific surfaces touched"
      - "Goal 13 items that appear evidence-backed"
      - "Goal 13 items that must remain unchecked"
      - "Recommended Worker package, or no-op if no refactor is needed"
    receipt:
      result: done
      summary: "Current dirty diff is consistent with the Windows compatibility-layer plan, but Windows home/root helper logic is still inline in cmd/bumblebee/roots.go. A small behavior-neutral OS-helper split is justified before Goal 3 adds baseline roots."
      evidence:
        - "git diff --name-only"
        - "git diff --stat"
        - "git diff -- cmd/bumblebee/roots.go cmd/bumblebee/main_test.go windows.md"
        - "windows.md Goal 13 checklist"
        - "cmd/bumblebee/roots.go"
      dirty_diff_map:
        - ".github/workflows/ci.yml: CI matrix, MSYS2 GCC, Windows build/selftest; platform/release surface."
        - ".goreleaser.yaml: Windows goos and zip archive; release surface."
        - "cmd/bumblebee/roots.go: root resolution plus Windows home/broad-root helper logic; platform-specific root discovery surface."
        - "cmd/bumblebee/main_test.go: Windows-aware root tests and explicit-root scan smoke tests; test surface."
        - "docs/state-model.md: record_id identity documentation; docs surface."
        - "internal/model/model.go and internal/model/model_test.go: shared identity hashing and tests; shared model surface."
        - "internal/scanner/scanner_test.go: cross-platform path assertion and wrapped error tests; test surface."
      shared_surfaces_touched:
        - "Record identity hashing, intentionally shared across platforms."
        - "Scanner tests, path assertions, and expected error classifier tests."
        - "Docs describing shared state model."
      platform_specific_surfaces_touched:
        - "Windows CI/release configuration."
        - "Windows home detection and broad home root detection."
        - "Windows-aware CLI tests."
      goal13_evidence_backed:
        - "Metadata parsers remain shared; no parser files changed."
        - "Output schema remains shared; docs/schema is not in the dirty diff."
        - "Exposure matching remains shared; internal/exposure is not in the dirty diff."
        - "Sink behavior remains shared; internal/output is not in the dirty diff."
        - "Existing profile meanings remain unchanged; no root kind/profile constants changed."
        - "Windows docs remain additive in windows.md."
        - "Tests prove Windows behavior without weakening existing macOS/Linux tests."
      goal13_must_remain_unchecked:
        - "Rebase regularly from upstream main."
        - "Open upstream PRs in small slices."
        - "Structure commits so CI/release, explicit-root support, baseline defaults, browser roots, and docs can be reviewed separately, unless commits are actually created."
      recommended_worker_package: "Move userHomeDir, samePath, and Windows broad-home root detection behind roots_windows.go / roots_nonwindows.go helpers; update windows.md Goal 13 checkboxes supported by evidence; run full verification."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Decide whether the hygiene tranche needs a Worker refactor and approve the exact allowed file set."
    inputs:
      - "T001 receipt"
      - "windows.md"
      - "Current dirty diff"
    constraints:
      - "Read-only."
      - "Reject any baseline-root, browser-root, all-users, WSL, deployment-doc, endpoint-identity, or native-ecosystem work."
      - "Reject schema, parser, sink, exposure, CLI, root-kind, or profile semantic changes."
      - "Approve only behavior-neutral helper isolation and checklist/test updates."
    expected_output:
      - "Decision: worker_required | no_worker_required | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Goal 13 checklist items allowed to mark"
    receipt:
      result: done
      decision: worker_required
      full_outcome_complete: false
      rationale: "A behavior-neutral helper split is warranted: current Windows-specific home and broad-root logic is correct but inline in roots.go. Moving only helper implementations into OS-specific files strengthens the Goal 13 compatibility-layer boundary before baseline roots are added."
      worker_task: T003
      exact_worker_objective: "Move platform-specific home path equality and broad-root detection helpers out of roots.go into roots_windows.go and roots_nonwindows.go, preserve current behavior, and mark only proven Goal 13 checklist items."
      allowed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "cmd/bumblebee/main_test.go"
        - "windows.md"
      verify:
        - "go test ./..."
        - "go test -race ./..."
        - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
        - "./bumblebee.exe selftest"
        - "git diff --check"
      stop_if:
        - "Need files outside allowed_files."
        - "Need to add Windows baseline roots, browser roots, all-users behavior, WSL behavior, deployment docs, endpoint identity policy, or native ecosystem inventory."
        - "Need to change public schemas, parser behavior, sink behavior, exposure matching, CLI flags, root kinds, profile names, or emitted record semantics."
      goal13_items_allowed_to_mark:
        - "Keep repo layout unchanged unless an upstreamable refactor requires it."
        - "Keep metadata parsers shared across macOS, Linux, and Windows."
        - "Keep the output schema identical across platforms."
        - "Keep exposure matching shared across platforms."
        - "Keep sink behavior shared across platforms."
        - "Isolate Windows root discovery behind small OS-specific functions."
        - "Prefer *_windows.go files or narrow runtime.GOOS == \"windows\" branches for platform-specific behavior."
        - "Avoid Windows-only semantic changes to existing profile meanings."
        - "Add tests that prove Windows behavior without weakening macOS/Linux tests."
        - "Keep Windows docs additive instead of rewriting existing macOS/Linux docs."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Execute the Judge-approved behavior-neutral fork hygiene package."
    allowed_files:
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/roots_windows.go"
      - "cmd/bumblebee/roots_nonwindows.go"
      - "cmd/bumblebee/main_test.go"
      - "windows.md"
    verify:
      - "go test ./..."
      - "go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
      - "./bumblebee.exe selftest"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Need to add new Windows baseline roots, browser roots, all-users behavior, WSL behavior, deployment docs, endpoint identity policy, or native ecosystem inventory."
      - "Need to change public schema files, parser behavior, sink behavior, exposure matching, CLI flags, root kinds, profile names, or emitted record semantics."
      - "Behavior-neutral tests fail twice for unclear reasons."
      - "Judge decides no Worker is required."
    receipt:
      result: done
      changed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "windows.md"
      commands:
        - cmd: "gofmt -w cmd/bumblebee/roots.go cmd/bumblebee/roots_windows.go cmd/bumblebee/roots_nonwindows.go"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "CGO_ENABLED=1 go test -race ./..."
          status: pass
        - cmd: "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Moved platform-specific home lookup, path equality, and broad-root detection helpers into roots_windows.go / roots_nonwindows.go, leaving roots.go behavior-neutral. Updated windows.md only for proven Goal 13 hygiene items."
      scope_guard:
        - "No Windows baseline roots, browser roots, all-users behavior, WSL behavior, deployment docs, endpoint identity policy, or native ecosystem inventory added."
        - "No public schema, parser behavior, sink behavior, exposure matching, CLI flags, root kinds, profile names, or emitted record semantics changed."

  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and windows.md tracking after the hygiene package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "T003 receipt if Worker ran"
      - "windows.md"
    constraints:
      - "Only update GoalBuddy control files unless T003 already updated windows.md."
      - "Do not mark commit/rebase/upstream PR items unless those actions actually happened."
      - "Do not claim broader Windows support complete."
    expected_output:
      - "Board state updated"
      - "Remaining Goal 13 and Windows support gaps"
    receipt:
      result: done
      summary: "Board receipts and windows.md tracking are current. Goal 13 now marks evidence-backed compatibility-boundary items complete and leaves process items unchecked."
      checked_goal13_items:
        - "Keep repo layout unchanged unless an upstreamable refactor requires it."
        - "Keep metadata parsers shared across macOS, Linux, and Windows."
        - "Keep the output schema identical across platforms."
        - "Keep exposure matching shared across platforms."
        - "Keep sink behavior shared across platforms."
        - "Isolate Windows root discovery behind small OS-specific functions."
        - "Prefer *_windows.go files or narrow runtime.GOOS == \"windows\" branches for platform-specific behavior."
        - "Avoid Windows-only semantic changes to existing profile meanings."
        - "Add tests that prove Windows behavior without weakening macOS/Linux tests."
        - "Keep Windows docs additive instead of rewriting existing macOS/Linux docs."
      remaining_goal13_items:
        - "Structure commits so CI/release, explicit-root support, baseline defaults, browser roots, and docs can be reviewed separately."
        - "Rebase regularly from upstream main while Windows support is still fork-only."
        - "Open upstream PRs in small slices when possible."
        - "Treat conflicts in shared parser/schema/output code as a warning sign that the compatibility layer is leaking."
      remaining_windows_gaps:
        - "Minimum supported Windows versions."
        - "Windows baseline roots and baseline roots tests."
        - "Windows browser extension roots and tests."
        - "Windows multi-user scanning policy."
        - "Windows walker hardening."
        - "Windows endpoint identity docs/tests."
        - "Windows deployment/user-facing docs."
        - "Windows-native ecosystem scope."
        - "WSL behavior policy."
        - "Remaining real-profile end-to-end smoke tests."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the fork hygiene tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if scope widened beyond behavior-neutral fork hygiene."
      - "Reject completion if windows.md marks unproven Goal 13 or broader Windows items."
      - "Reject completion if verification does not cover the changed behavior."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      prompt_to_artifact_checklist:
        - requirement: "Read-only audit maps current Windows diff to compatibility boundaries."
          evidence: "T001 receipt maps CI/release, root helpers, tests, docs, model identity, and scanner test surfaces."
        - requirement: "Judge confirms exact allowed refactor."
          evidence: "T002 receipt approves only behavior-neutral helper isolation in roots.go, roots_windows.go, roots_nonwindows.go, main_test.go, and windows.md."
        - requirement: "Worker changes are behavior-neutral and limited to root/home helper isolation plus checklist updates."
          evidence: "T003 receipt changed roots.go, roots_windows.go, roots_nonwindows.go, and windows.md; roots.go now calls isPlatformBroadHomeRoot/userHomeDir/samePath and OS implementations live in build-tagged files."
        - requirement: "No baseline roots, browser roots, all-users, WSL, deployment, endpoint identity, or native ecosystem work."
          evidence: "T003 scope guard plus diff review; Goal 3-12 broader items remain unchecked in windows.md."
        - requirement: "No schema, parser, sink, exposure, CLI, root-kind, or profile semantic changes in this tranche."
          evidence: "Audit command found no diffs under docs/schema, internal/ecosystem, internal/output, internal/exposure, or cmd/bumblebee/main.go."
        - requirement: "windows.md Goal 13 reflects only proven facts."
          evidence: "Goal 13 checks shared parser/schema/exposure/sink, OS-specific helper isolation, *_windows.go preference, unchanged profile meanings, tests, and additive docs; commit/rebase/upstream-PR/conflict items remain unchecked."
        - requirement: "Verification commands pass."
          evidence: "T003 receipt records passing go test ./..., CGO_ENABLED=1 go test -race ./..., Windows build+selftest, and git diff --check."
        - requirement: "No build artifact remains."
          evidence: "Test-Path ./bumblebee.exe returned False after cleanup."
      residual_risk:
        - "Current worktree still contains prior uncommitted Windows core and record-ID changes; this tranche did not attempt commit splitting."
        - "Remote CI has not run in this local session."

checks:
  dirty_fingerprint: "fork hygiene helper split plus previous Windows core and record-id changes"
  last_verification:
    result: pass
    task: T003
    commands:
      - "go test ./..."
      - "CGO_ENABLED=1 go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
      - "git diff --check"
