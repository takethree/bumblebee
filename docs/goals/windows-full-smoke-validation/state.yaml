# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Full Smoke Validation"
  slug: "windows-full-smoke-validation"
  kind: existing_plan
  tranche: "Smoke test the implemented Windows compatibility layer and record a redacted receipt."
  status: done
  oracle:
    signal: "Implemented Windows compatibility-layer behavior is smoke-tested end to end, redacted evidence is recorded, and untested gaps remain explicit."
    cadence: "after smoke matrix validation, after smoke execution, and at final audit"
    final_proof: "Smoke commands pass or produce explicit blockers, windows.md contains a redacted receipt, raw inventory is outside the repo, and the branch is pushed."
  intake:
    original_request: "$goalbuddy:goal-prep after the full Windows smoke-test plan."
    interpreted_outcome: "Prepare a GoalBuddy board to run a comprehensive smoke validation of implemented Windows compatibility-layer behavior."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: test
    completion_proof: "A pushed windows.md receipt maps implemented Windows behavior to passing smoke evidence and preserves known gaps."
    likely_misfire: "Claiming full Windows support from a partial smoke run or hiding open compatibility gaps."
    blind_spots_considered:
      - "Existing windows-smoke.ps1 covers many paths but not endpoint device_id propagation or every completed checklist item."
      - "Raw NDJSON can contain inventory and identity data and must stay outside the repo."
      - "Windows race tests may need MSYS2 GCC; reputable prerequisites should be installed or used rather than skipped."
      - "Open checklist items in windows.md must remain open unless this smoke actually covers them."
      - "A smoke failure should produce a blocker receipt, not silent product changes."
    existing_plan_facts:
      - "Run CI parity commands: gofmt, go vet, go test, race test, build, selftest."
      - "Run scripts/windows-smoke.ps1 with a temp evidence root."
      - "Add focused temp-fixture smokes for explicit roots, endpoint device_id, all-users expansion, and implemented root families."
      - "Record only redacted aggregate evidence in windows.md."
      - "Do not edit README, schemas, scanner behavior, root discovery, release config, or deployment docs."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-full-smoke-validation"
    note: "npx reached Socket Firewall, but board startup failed: [sfw] Failed to prepare firewall binary: Unable to fetch latest release and no valid cached release found. File-backed board is ready."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Validate the smoke matrix against current windows.md, scripts/windows-smoke.ps1, CI config, and local tool availability."
    inputs:
      - "docs/goals/windows-full-smoke-validation/goal.md"
      - "windows.md"
      - "scripts/windows-smoke.ps1"
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "local Go/MSYS2/toolchain availability"
    constraints:
      - "Read-only."
      - "Do not run smoke tests yet."
      - "Do not edit repo files."
      - "Map implemented checklist items to concrete commands or explicit non-goals."
      - "Call out any smoke path that requires a reputable prerequisite before execution."
    expected_output:
      - "Smoke matrix"
      - "Exact command sequence"
      - "Evidence directory and redaction rules"
      - "Known non-goals/open gaps"
      - "Exact Worker package with allowed files, verify commands, and stop conditions"
    receipt:
      result: done
      summary: "Validated the full Windows smoke matrix against windows.md, the smoke script, CI, release config, and local tool availability."
      evidence:
        - "windows.md has completed Goal 1, Goal 2, parts of Goals 3/4/6/7, all of Goal 5, Goal 12, and Goal 13 maintenance constraints that need smoke or test coverage."
        - "scripts/windows-smoke.ps1 covers build, selftest, baseline roots, baseline file scan, local HTTP bearer scan, redacted summary, and raw evidence outside the repo."
        - ".github/workflows/ci.yml runs gofmt, go vet, go test, go test -race, go build, and selftest on windows-latest with MSYS2 GCC exposed."
        - ".goreleaser.yaml builds windows artifacts for amd64 and arm64 and uses zip archives."
        - "Local Go exists at C:\\Users\\bbutner\\AppData\\Local\\Programs\\bumblebee-tools\\go1.26.3\\go\\bin\\go.exe."
        - "gcc is not currently on PATH; no existing UCRT64 gcc was found in the checked common install paths, so race tests may require reputable MSYS2 setup during Worker execution."
      smoke_matrix:
        - "CI parity: gofmt -l ., go vet ./..., go test ./..., go test -race ./..., go build, selftest."
        - "Release artifact smoke: cross-build windows/amd64 and windows/arm64 to a temp evidence directory; run amd64 only."
        - "Existing script smoke: run scripts\\windows-smoke.ps1 with PATH adjusted to include the local Go bin."
        - "Focused explicit-root smoke: temp project and deep scans over a path with spaces; assert package records, record_id, source_file, project_path, root_kind, and complete summaries."
        - "Focused endpoint smoke: use --device-id-env and assert package and scan_summary endpoint fields match, include device_id, Windows SID uid, and non-empty username."
        - "Focused all-users smoke: set BUMBLEBEE_USERS_DIR to a temp profile parent and verify service profile filtering, no bare homes, per-user root expansion, and complete scan behavior."
        - "Focused root-family smoke: controlled temp homes for implemented Go, editor, MCP, Chrome, Edge, and Firefox roots; verify roots preview includes implemented families only."
      non_goals:
        - "Do not close username-shape validation across local/domain/Azure AD unless the smoke actually covers all three."
        - "Do not claim Windows arm64 runtime execution; only build can be smoke-tested on this amd64 host."
        - "Do not claim Brave, Chromium, Vivaldi, LibreWolf, Waterfox, redirected known folders, WSL, native Windows ecosystems, deployment docs, or user-facing README support."
      worker_package:
        objective: "Run the approved full Windows smoke suite, keep raw evidence in %TEMP%, and record only a redacted receipt in windows.md."
        allowed_files:
          - "windows.md"
          - "docs/goals/windows-full-smoke-validation/state.yaml"
        verify:
          - "gofmt -l ."
          - "go vet ./..."
          - "go test ./..."
          - "go test -race ./..."
          - "go build -buildvcs=false -o <temp>\\bumblebee.exe ./cmd/bumblebee"
          - "<temp>\\bumblebee.exe selftest"
          - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1 -EvidenceRoot <temp>"
          - "focused fixture smoke script producing redacted aggregate JSON"
          - "git diff --check -- windows.md docs/goals/windows-full-smoke-validation/state.yaml"
        stop_if:
          - "Need product behavior changes to pass."
          - "Need to commit raw inventory, SID, hostname, username, token, or full profile path data."
          - "Need files outside windows.md and GoalBuddy control files."
          - "A critical smoke command fails twice for the same reason."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve the bounded full-smoke execution package."
    inputs:
      - "T001 receipt"
      - "docs/goals/windows-full-smoke-validation/goal.md"
      - "The proposed smoke-test plan from chat"
    constraints:
      - "Read-only."
      - "Reject product implementation work."
      - "Reject raw inventory or identity data committed to the repo."
      - "Reject README, schema, scanner, root-discovery, CI, GoReleaser, or deployment-doc edits."
      - "Reject completion criteria that hide open windows.md gaps."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Required receipt wording constraints"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      worker_objective: "Run the approved full Windows smoke suite, keep raw evidence in %TEMP%, and record only a redacted receipt in windows.md."
      allowed_files:
        - "windows.md"
        - "docs/goals/windows-full-smoke-validation/state.yaml"
      verify:
        - "gofmt -l ."
        - "go vet ./..."
        - "go test ./..."
        - "go test -race ./..."
        - "go build -buildvcs=false -o <temp>\\bumblebee.exe ./cmd/bumblebee"
        - "<temp>\\bumblebee.exe selftest"
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1 -EvidenceRoot <temp>"
        - "focused fixture smoke script producing redacted aggregate JSON"
        - "git diff --check -- windows.md docs/goals/windows-full-smoke-validation/state.yaml"
      stop_if:
        - "Need product behavior changes to pass."
        - "Need README, schema, scanner behavior, root discovery, CI, GoReleaser, or deployment docs changes."
        - "Need to commit raw NDJSON, SIDs, hostnames, usernames, tokens, or full profile paths."
        - "Need files outside windows.md and GoalBuddy control files."
        - "A critical smoke command fails twice for the same reason."
      receipt_constraints:
        - "Record redacted counts, command statuses, and pass/fail facts only."
        - "Preserve known open gaps instead of closing untested checklist items."
        - "State where raw evidence was kept outside the repo."
      rationale: "The package validates existing compatibility-layer behavior and writes only a redacted smoke receipt, with no product or schema changes."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Run the approved full Windows smoke suite and record a redacted receipt."
    allowed_files:
      - "windows.md"
      - "docs/goals/windows-full-smoke-validation/state.yaml"
    verify:
      - "gofmt -l ."
      - "go vet ./..."
      - "go test ./..."
      - "go test -race ./..."
      - "go build -buildvcs=false -o <temp>\\bumblebee.exe ./cmd/bumblebee"
      - "<temp>\\bumblebee.exe selftest"
      - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1 -EvidenceRoot <temp>"
      - "focused fixture smoke script producing redacted aggregate JSON"
      - "git diff --check -- windows.md docs/goals/windows-full-smoke-validation/state.yaml"
    stop_if:
      - "Need to change product behavior to make a smoke pass."
      - "Need to commit raw NDJSON, SIDs, hostnames, usernames, tokens, or full profile paths."
      - "Need files outside allowed_files."
      - "Need README, schema, scanner behavior, root discovery, CI, GoReleaser, or deployment docs changes."
      - "A critical smoke command fails twice for the same reason."
    receipt:
      result: done
      summary: "Ran the approved full Windows smoke suite and recorded a redacted aggregate receipt in windows.md."
      changed_files:
        - "windows.md"
        - "docs/goals/windows-full-smoke-validation/state.yaml"
      commands:
        - command: "gofmt -l ."
          status: pass
          note: "Direct Windows working-tree check reported CRLF line-ending noise; clean LF checkout-index export had no gofmt output."
        - command: "go vet ./..."
          status: pass
        - command: "go test ./..."
          status: pass
        - command: "go test -race ./..."
          status: pass
        - command: "go build -buildvcs=false -o <temp>\\bumblebee.exe ./cmd/bumblebee"
          status: pass
        - command: "<temp>\\bumblebee.exe selftest"
          status: pass
        - command: "windows/amd64 and windows/arm64 cross-build smoke"
          status: pass
        - command: "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1 -EvidenceRoot <temp> -MaxDurationSeconds 180"
          status: pass
        - command: "focused fixture smoke script for explicit roots, endpoint device_id, all-users, and controlled root families"
          status: pass
        - command: "git diff --check -- windows.md docs\\goals\\windows-full-smoke-validation\\state.yaml"
          status: pass
      evidence:
        - "Official MSYS2 2026-03-22 installer was downloaded from the MSYS2 GitHub release and matched the official SHA-256 file before UCRT64 GCC installation."
        - "MSYS2 UCRT64 GCC reported the MSYS2 16.1.0 build and allowed Windows race tests to pass with CGO enabled."
        - "windows-smoke.ps1 redacted summary: 9 roots, 3 browser extension roots, 1 editor extension root, 5 MCP roots, 1,042 baseline package records, complete baseline scan_summary, complete HTTP sink summary, 0 HTTP auth failures."
        - "Focused explicit project/deep fixture scans each emitted 1 package record and complete scan_summary over a path containing spaces."
        - "Focused endpoint smoke confirmed matching package/summary endpoint fields with env-provided device_id, SID-shaped uid, non-empty username, and uid not equal to -1."
        - "Focused controlled root-family smoke confirmed implemented Go, editor, MCP, Chrome, Edge, and Firefox root families with 5 package records and complete baseline scan_summary."
        - "Focused controlled all-users smoke confirmed 2 real user homes expanded, service/system profiles filtered, 0 bare home roots, 2 package records, and complete baseline scan_summary."
        - "Raw NDJSON, HTTP payloads, tokens, SIDs, hostnames, usernames, and full profile paths were not committed; only redacted aggregate evidence was added to windows.md."
        - "Known open gaps stayed open in windows.md."

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: low
    objective: "Commit and push the verified Windows full-smoke receipt."
    allowed_files:
      - "windows.md"
      - "docs/goals/windows-full-smoke-validation/goal.md"
      - "docs/goals/windows-full-smoke-validation/state.yaml"
    verify:
      - "git status --short"
      - "git log --oneline --decorate -1"
    stop_if:
      - "Unrelated dirty files appear."
      - "Smoke verification did not pass or is not recorded."
      - "Commit would include files outside windows.md and GoalBuddy control files."
      - "Push to origin/windows/compat-layer fails."
    receipt:
      result: done
      summary: "Committed and pushed the verified Windows full-smoke receipt."
      changed_files:
        - "windows.md"
        - "docs/goals/windows-full-smoke-validation/goal.md"
        - "docs/goals/windows-full-smoke-validation/state.yaml"
      commands:
        - command: "git add windows.md docs\\goals\\windows-full-smoke-validation\\goal.md docs\\goals\\windows-full-smoke-validation\\state.yaml"
          status: pass
        - command: "git commit -m \"docs: record Windows full smoke validation\""
          status: pass
        - command: "git push origin windows/compat-layer"
          status: pass
      evidence:
        - "Commit eb641a4 was created and pushed to origin/windows/compat-layer."
        - "git show --stat --name-only HEAD listed only windows.md and GoalBuddy control files."
        - "Branch was clean after push before completion-receipt update."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the Windows full-smoke validation tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md smoke receipt"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if smoke evidence is incomplete, raw, unredacted, or broader than implemented behavior."
      - "Reject completion if README, schema, scanner behavior, root discovery, CI, GoReleaser, or deployment docs changed."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Evidence mapped to the oracle"
      - "Missing evidence or next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "Final audit passed for the Windows full-smoke validation tranche."
      checklist:
        - "Objective deliverable: implemented Windows compatibility-layer behavior was smoke-tested and a redacted receipt was added to windows.md."
        - "Current checklist mapping: implemented Goal 1/2/5/12 items and completed slices of Goals 3/4/6/7/13 were mapped to CI parity, script smoke, focused fixtures, or preserved non-goals."
        - "Smoke execution: go vet, go test, go test -race, build, selftest, windows-smoke.ps1, cross-builds, explicit project/deep, endpoint device_id, controlled root-family, and controlled all-users smokes passed."
        - "Evidence redaction: windows.md records only aggregate counts and pass/fail facts; raw NDJSON, identities, tokens, and full profile paths stayed outside the repo."
        - "Known gaps: windows.md still leaves username-shape matrix, remaining browser families, redirected folders, WSL, native ecosystems, deployment docs, user-facing docs, and maintenance tasks open."
        - "Scope audit: README.md, docs/schema, cmd, internal, CI, GoReleaser, deployment docs, and inventory docs were unchanged in the smoke receipt commit."
        - "Branch state: commit eb641a4 is pushed to origin/windows/compat-layer."
      commands:
        - command: "git status --short --branch"
          status: pass
        - command: "git log --oneline --decorate -4"
          status: pass
        - command: "git show --stat --name-only --oneline --no-renames HEAD"
          status: pass
        - command: "git diff --exit-code HEAD^ HEAD -- README.md docs\\schema cmd internal .github .goreleaser.yaml docs\\deployment-macos.md docs\\inventory-sources.md"
          status: pass
        - command: "rg -n \"Full smoke receipt|go test -race|MSYS2|windows/arm64|endpoint smoke|all-users smoke|Raw NDJSON|Known gaps\" windows.md"
          status: pass

checks:
  dirty_fingerprint: clean_at_prep
  last_verification:
    result: pass
    task: T999
    commands:
      - "git status --short --branch"
      - "git log --oneline --decorate -4"
      - "git show --stat --name-only --oneline --no-renames HEAD"
      - "git diff --exit-code HEAD^ HEAD -- README.md docs\\schema cmd internal .github .goreleaser.yaml docs\\deployment-macos.md docs\\inventory-sources.md"
      - "rg -n \"Full smoke receipt|go test -race|MSYS2|windows/arm64|endpoint smoke|all-users smoke|Raw NDJSON|Known gaps\" windows.md"
