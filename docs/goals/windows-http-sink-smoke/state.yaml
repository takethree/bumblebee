# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows HTTP Sink Smoke"
  slug: "windows-http-sink-smoke"
  kind: existing_plan
  tranche: "Add a deterministic local HTTP sink smoke to the Windows compatibility validation path."
  status: done
  oracle:
    signal: "Windows smoke proves --output http delivers package records and a complete scan_summary to a local loopback receiver with env-backed bearer auth."
    cadence: "after the implementation Worker package and at final audit"
    final_proof: "go test passes, windows-smoke.ps1 passes, git diff check passes, redacted smoke summary contains HTTP sink proof, and windows.md records the Goal 12 receipt."
  intake:
    original_request: "Come up with a plan for the next Windows Goal 12 HTTP sink smoke work, then prepare it with GoalBuddy."
    interpreted_outcome: "The Windows fork has end-to-end HTTP output proof without external services or secret leakage."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: test
    completion_proof: "The smoke script, redacted summary, and windows.md receipt prove HTTP delivery from the Windows binary."
    likely_misfire: "Turning this into a product HTTP sink refactor, external deployment test, or HMAC/gzip expansion instead of a bounded Windows smoke validation."
    blind_spots_considered:
      - "The receiver must avoid writing bearer tokens or raw inventory into repo files."
      - "The local receiver must be started and stopped deterministically so the smoke does not hang."
      - "Loopback HTTP is allowed by the existing sink; external HTTP is not needed."
      - "If product code fails, the implementation task should stop and create a focused bug-fix task rather than broadening scope silently."
    existing_plan_facts:
      - "Use a local loopback receiver, not an external ingest service."
      - "Use env-backed bearer auth and verify it at the receiver."
      - "Generate a small fixture project under the temp evidence directory."
      - "Run project-profile HTTP output with --http-batch-size 1."
      - "Add redacted HTTP sink counts/status to smoke-summary.redacted.json."
      - "Update windows.md Goal 12 and known gaps after passing verification."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: false
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-http-sink-smoke"
    note: "npx returned through Socket Firewall without starting the board: failed to fetch https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json (HTTP 404). File-backed board is ready."

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the HTTP smoke plan and approve the largest safe Worker package."
    inputs:
      - "docs/goals/windows-http-sink-smoke/goal.md"
      - "The proposed HTTP sink smoke plan from chat"
      - "scripts/windows-smoke.ps1"
      - "windows.md Goal 12"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve the compatibility-layer boundary."
      - "Reject product-code changes unless the smoke exposes a focused bug."
      - "Reject external service dependencies or secret/raw-inventory leakage."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Whether final implementation may be a single Worker package"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      worker_objective: "Implement a local loopback HTTP receiver in scripts/windows-smoke.ps1, run a project-profile HTTP scan with env-backed bearer auth, add redacted HTTP sink proof to the smoke summary, and update windows.md Goal 12."
      allowed_files:
        - "scripts/windows-smoke.ps1"
        - "windows.md"
      verify:
        - "go test ./cmd/bumblebee ./internal/..."
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check -- scripts/windows-smoke.ps1 windows.md"
        - "Inspect the generated smoke-summary.redacted.json for HTTP sink request count, package records, scan_summary status, and zero auth failures."
      stop_if:
        - "Need product code changes outside smoke validation."
        - "Need external HTTP service."
        - "Need to persist secrets or raw inventory in repo files."
        - "Need HMAC, gzip, deployment docs, or native Windows ecosystem scope."
        - "The local receiver cannot be made deterministic."
        - "Verification fails twice for the same reason."
      rationale: "The existing HTTP sink already supports loopback HTTP and env-backed bearer auth. The planned smoke validates Windows end-to-end delivery without changing shared scanner or sink behavior."
      single_worker_package: true

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement the approved Windows HTTP sink smoke and update the Goal 12 receipt."
    allowed_files:
      - "scripts/windows-smoke.ps1"
      - "windows.md"
    verify:
      - "go test ./cmd/bumblebee ./internal/..."
      - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check -- scripts/windows-smoke.ps1 windows.md"
      - "Inspect the generated smoke-summary.redacted.json for HTTP sink request count, package records, scan_summary status, and zero auth failures."
    stop_if:
      - "Need to change product code outside the smoke script and windows.md."
      - "Need an external HTTP service."
      - "Need to persist secrets or raw inventory in repo files."
      - "Need to add HMAC, gzip, deployment docs, or native Windows ecosystem scope."
      - "The local HTTP receiver cannot be made deterministic without a different design."
      - "Verification fails twice for the same reason."
    receipt:
      result: done
      changed_files:
        - "scripts/windows-smoke.ps1"
        - "windows.md"
      commands:
        - cmd: "go test ./cmd/bumblebee ./internal/..."
          status: pass
        - cmd: "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
          status: pass
        - cmd: "git diff --check -- scripts/windows-smoke.ps1 windows.md"
          status: pass
      smoke_summary: "C:\\Users\\bbutner\\AppData\\Local\\Temp\\bumblebee-windows-smoke\\20260524-161555\\smoke-summary.redacted.json"
      summary: "Added a temp-only loopback HTTP receiver to the Windows smoke script, generated a no-BOM package fixture, ran project-profile --output http with env-backed bearer auth, recorded redacted HTTP sink proof, and updated windows.md Goal 12."
      evidence:
        - "HTTP sink smoke command status: pass."
        - "Receiver requests: 2."
        - "Receiver auth failures: 0."
        - "Received package records: 1."
        - "Received scan_summary status/profile: complete/project."
        - "HTTP summary status fields: attempted=1, succeeded=1, last_status=200."

  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review the implemented HTTP sink smoke for proof quality, secret hygiene, and scope control."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "Current dirty diff"
      - "Smoke summary path"
      - "windows.md Goal 12"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Reject completion if the smoke can pass without proving HTTP delivery."
      - "Reject completion if secrets or raw inventory can enter repo files."
    expected_output:
      - "approved | needs_fix | blocked"
      - "Proof-quality assessment"
      - "Required fix task if not approved"
      - "Whether final audit may proceed"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      proof_quality: "Strong for this tranche. The smoke can only pass if the local receiver sees at least one request, zero auth failures, at least one package record, and a complete scan_summary."
      secret_hygiene: "Approved. The generated bearer token lives only in process environment state and receiver comparison logic; the redacted summary records auth counts but not the token."
      scope_control: "Approved. Changes are limited to scripts/windows-smoke.ps1, windows.md, and GoalBuddy control files; no product code, external service, HMAC, gzip, deployment, or native ecosystem scope was added."
      final_audit_may_proceed: true

  - id: T004
    type: worker
    assignee: Worker
    status: blocked
    reasoning_hint: medium
    objective: "Apply any focused fixes required by T003, if Judge does not approve the first implementation package."
    allowed_files:
      - "scripts/windows-smoke.ps1"
      - "windows.md"
    verify:
      - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check -- scripts/windows-smoke.ps1 windows.md"
    stop_if:
      - "T003 did not produce exact required fixes."
      - "Need files outside allowed_files."
      - "Fix requires changing behavior outside the smoke validation tranche."
      - "Verification fails twice for the same reason."
    receipt:
      result: not_required
      summary: "T003 approved the implementation package; no focused fix Worker is required."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the Windows HTTP sink smoke tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md Goal 12"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if tests or smoke verification are stale, missing, or red."
      - "Reject completion if HTTP delivery, scan_summary status, or auth proof is weak."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Evidence mapped to the oracle"
      - "Missing evidence or next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      checklist:
        - requirement: "scripts/windows-smoke.ps1 runs on Windows and includes a local loopback HTTP receiver."
          evidence: "Smoke command passed; script now starts Start-SmokeHttpReceiver and records scan_project_http."
        - requirement: "The receiver gets package records and a scan_summary with status=complete."
          evidence: "Redacted summary shows request_count=2, package_records=1, summary_present=true, summary_status=complete, summary_profile=project."
        - requirement: "Bearer auth is supplied by environment variable, verified, and not written to the redacted summary."
          evidence: "Redacted summary shows auth_failures=0; search for the generated token prefix, Bearer, and BUMBLEBEE_SMOKE_HTTP_TOKEN in the summary returned no matches."
        - requirement: "windows.md Goal 12 is updated."
          evidence: "HTTP sink checkbox is checked and a 2026-05-24 Windows HTTP sink validation receipt is present."
        - requirement: "Verification commands passed."
          evidence: "go test ./cmd/bumblebee ./internal/... passed; scripts/windows-smoke.ps1 passed; git diff --check -- scripts/windows-smoke.ps1 windows.md passed."
        - requirement: "Scope stayed within the compatibility-validation tranche."
          evidence: "git diff --name-only shows only scripts/windows-smoke.ps1 and windows.md as product-facing changes; GoalBuddy control files are separate board artifacts."
      summary: "Windows HTTP sink smoke tranche is complete. The Windows smoke script now proves env-backed bearer HTTP delivery to a local receiver and records only redacted proof in the smoke summary and windows.md."

