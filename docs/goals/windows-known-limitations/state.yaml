# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Known Limitations Capture"
  slug: "windows-known-limitations"
  kind: existing_plan
  tranche: "Document the current Windows compatibility-layer support boundary before closing Goal 12."
  status: active
  oracle:
    signal: "windows.md explicitly states tested support, planned gaps, and not-claimed Windows scope, with Goal 12's known-limitations checkbox checked only after the section exists."
    cadence: "after the docs Worker package and at final audit"
    final_proof: "git diff check passes, targeted limitation-topic searches find the expected coverage, and the final diff only changes windows.md."
  intake:
    original_request: "$goalbuddy:goal-prep after the Windows known-limitations plan."
    interpreted_outcome: "Prepare a GoalBuddy board to implement the docs-only Windows known-limitations slice carefully and in line with windows.md."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: artifact
    completion_proof: "windows.md contains the explicit support-boundary section, Goal 12 is updated honestly, and verification commands pass."
    likely_misfire: "Calling Windows support complete by wording around unimplemented or untested areas instead of preserving visible open gaps."
    blind_spots_considered:
      - "Documentation can create support claims just as easily as code can."
      - "Closing the Goal 12 limitation checkbox must not close unrelated implementation gaps."
      - "README and operator docs should wait until the support boundary is stable."
      - "The compatibility-layer model should minimize divergence from upstream Bumblebee."
    existing_plan_facts:
      - "Docs-only implementation slice."
      - "Only windows.md should be edited."
      - "Add a Known Limitations / Current Support Boundary section."
      - "Distinguish tested support, planned but untested work, and not-currently-claimed support."
      - "Cover platform version, roots, browsers, multi-user/profile discovery, walker behavior, endpoint identity, WSL, deployment docs, and diagnostics wording."
      - "Commit message after implementation: docs: capture Windows support limitations."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: false
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-known-limitations"
    note: "npx returned through Socket Firewall without starting the board: failed to fetch https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json (HTTP 404). File-backed board is ready."

active_task: T003

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the docs-only limitations plan and approve the exact Worker package."
    inputs:
      - "docs/goals/windows-known-limitations/goal.md"
      - "The proposed Windows Known Limitations Capture plan from chat"
      - "windows.md"
    constraints:
      - "Read-only."
      - "Do not edit implementation or docs files."
      - "Preserve the compatibility-layer model."
      - "Reject any plan that changes behavior or broadens support claims."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Whether the implementation may be a single Worker package"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      worker_objective: "Add a Known Limitations / Current Support Boundary section to windows.md, check only Goal 12's known-limitations item, and preserve all open implementation gaps."
      allowed_files:
        - "windows.md"
      verify:
        - "git diff --check -- windows.md"
        - "rg -n \"Known Limitations|Current Support Boundary|WSL|NuGet|diagnostics_count|redirected|reparse|Brave|Composer\" windows.md"
        - "git diff --stat"
      stop_if:
        - "Need to edit any file other than windows.md."
        - "Need to change product code, smoke scripts, README, deployment docs, or branch model."
        - "Cannot describe a support area without implying unsupported feature parity."
        - "Verification fails twice for the same reason."
      rationale: "The requested slice is docs-only, bounded to the existing Windows compatibility plan, and should make support limits explicit without changing behavior or closing unrelated implementation goals."
      single_worker_package: true

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement the approved docs-only known-limitations update in windows.md."
    allowed_files:
      - "windows.md"
    verify:
      - "git diff --check -- windows.md"
      - "rg -n \"Known Limitations|Current Support Boundary|WSL|NuGet|diagnostics_count|redirected|reparse|Brave|Composer\" windows.md"
      - "git diff --stat"
    stop_if:
      - "Need to edit any file other than windows.md."
      - "Need to change product code, smoke scripts, README, deployment docs, or branch model."
      - "Cannot describe a support area without implying unsupported feature parity."
      - "Verification fails twice for the same reason."
    receipt:
      result: done
      changed_files:
        - "windows.md"
      commands:
        - cmd: "git diff --check -- windows.md"
          status: pass
        - cmd: "rg -n \"Known limitations|current support boundary|WSL|NuGet|diagnostics_count|redirected|reparse|Brave|Composer\" windows.md"
          status: pass
        - cmd: "git diff --stat"
          status: pass
      summary: "Added a Known limitations / current support boundary section to windows.md, checked Goal 12's limitation-capture item, and kept future implementation gaps open."
      evidence:
        - "windows.md diff only: 50 insertions, 2 deletions."
        - "Support boundary covers tested support, platform version, roots, browsers, multi-user, walker/privacy, endpoint identity, deployment docs, native ecosystems, WSL, and diagnostics wording."
        - "Remaining browser-family and implementation items remain open for future GoalBuddy slices."

  - id: T003
    type: worker
    assignee: Worker
    status: active
    reasoning_hint: low
    objective: "Commit and push the verified docs-only known-limitations update."
    allowed_files:
      - "windows.md"
    verify:
      - "git status --short"
      - "git log --oneline --decorate -1"
    stop_if:
      - "Unrelated dirty files appear."
      - "The implementation Worker did not pass verification."
      - "Commit would include files other than windows.md and GoalBuddy control files."
      - "Push to origin/windows/compat-layer fails."
    receipt: null

  - id: T999
    type: judge
    assignee: Judge
    status: queued
    reasoning_hint: high
    objective: "Audit whether the Windows known-limitations tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md Goal 12"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if the docs claim support beyond tested compatibility-layer behavior."
      - "Reject completion if future implementation gaps were closed without implementation evidence."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Evidence mapped to the oracle"
      - "Missing evidence or next task if not complete"
    receipt: null

checks:
  dirty_fingerprint: unknown
  last_verification:
    result: unknown
    task: null
    commands: []
