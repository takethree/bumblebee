# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Compatibility Maintenance Cleanup"
  slug: "windows-maintenance-cleanup"
  kind: existing_plan
  tranche: "Reduce avoidable shared base-code drift while preserving Windows compatibility-layer behavior."
  status: done
  oracle:
    signal: "Shared base-code changes are minimized, Windows-specific behavior lives behind platform seams/build-tagged tests, and current Windows behavior remains verified."
    cadence: "after the implementation Worker package and at final audit"
    final_proof: "Targeted/full Go tests pass, Windows smoke passes, git diff checks pass, windows.md records only maintenance facts, and final audit records full_outcome_complete: true."
  intake:
    original_request: "Code maintenance should be easy; changing base-code complicates life. Prepare the maintenance cleanup plan as a GoalBuddy goal."
    interpreted_outcome: "The Windows fork is easier to maintain by removing avoidable shared core changes and isolating Windows-specific code."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and future upstream reviewers"
    authority: approved
    proof_type: test
    completion_proof: "The cleanup is implemented, current Windows behavior still passes tests/smoke, and the final audit proves no new scope leaked into shared base behavior."
    likely_misfire: "Rewriting shared architecture, changing scanner semantics, weakening verified Windows behavior, or creating large unrelated refactors while trying to reduce maintenance risk."
    blind_spots_considered:
      - "StableID path normalization is a shared core semantic change and should be removed unless separately approved."
      - "Windows browser root literals in shared root logic increase merge friction and should move behind a platform hook if safe."
      - "Moving tests can itself cause churn; only move Windows-only tests where it materially reduces shared-file friction."
    existing_plan_facts:
      - "Revert shared StableID path-normalization changes and related docs/tests."
      - "Move Windows browser candidate roots and platform root classification behind platform hooks."
      - "Keep shared code as orchestration only where practical."
      - "Preserve existing Windows baseline/browser/all-users/privacy behavior."
      - "Do not alter schema fields, parsers, sinks, endpoint identity, root kinds, profile meanings, WSL, deployment, or native ecosystem scope."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: false
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-maintenance-cleanup"
    note: "npx is not available on PATH in this shell, so the local board could not be started during goal prep."

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the maintenance cleanup plan against the current dirty diff and approve the largest safe Worker package."
    inputs:
      - "docs/goals/windows-maintenance-cleanup/goal.md"
      - "The approved maintenance cleanup plan from chat"
      - "Current dirty diff"
      - "windows.md Goal 13"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve verified Windows behavior."
      - "Reject schema, parser, sink, endpoint identity, profile, root-kind, WSL, deployment, native ecosystem, or broad scanner changes."
    expected_output:
      - "approved | revise | blocked"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Whether test movement is worth doing in this tranche"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The approved cleanup directly targets the two avoidable maintenance risks in the dirty diff: shared StableID path normalization and Windows root/browser literals in shared roots.go. Selective test movement is worthwhile for Windows-only root/walker/scanner tests, but shared helpers and genuinely cross-platform tests should remain in shared files."
      worker_objective: "Remove shared StableID path-normalization changes; move Windows root classification and browser candidate roots behind platform hooks; move Windows-only tests into build-tagged Windows test files where it reduces shared-file churn; preserve current Windows behavior and update only maintenance tracking."
      allowed_files:
        - "internal/model/model.go"
        - "internal/model/model_test.go"
        - "docs/state-model.md"
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/roots_nonwindows.go"
        - "cmd/bumblebee/main_test.go"
        - "cmd/bumblebee/main_windows_test.go"
        - "internal/scanner/scanner_test.go"
        - "internal/scanner/scanner_windows_test.go"
        - "internal/walk/walk_test.go"
        - "internal/walk/walk_windows_test.go"
        - "windows.md"
      verify:
        - "gofmt -w on touched Go files"
        - "go test ./cmd/bumblebee ./internal/..."
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check -- touched files"
        - "rg \"identityPath|Path-bearing tuple fields are normalized\" internal/model docs/state-model.md"
        - "rg \"case \\\"windows\\\"|AppData|Microsoft/Edge|Packages/Claude\" cmd/bumblebee/roots.go"
      stop_if:
        - "Need files outside allowed_files."
        - "Need to keep StableID path normalization as a shared core change."
        - "Need to weaken verified Windows behavior."
        - "Need schema, parser, sink, endpoint identity, profile, root-kind, WSL, deployment, or native ecosystem behavior changes."

