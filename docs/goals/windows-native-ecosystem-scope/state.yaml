# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Native Ecosystem Scope"
  slug: "windows-native-ecosystem-scope"
  kind: existing_plan
  tranche: "Document Goal 10 ecosystem decisions, then implement and verify NuGet project/deep inventory as the first Windows-native compatibility-layer parser."
  status: done
  oracle:
    signal: "Goal 10 in windows.md is decision-complete, and NuGet project/deep scans emit schema-compatible package records from packages.config and packages.lock.json with passing tests and no package-manager execution."
    cadence: "after each Worker package and at final audit"
    final_proof: "windows.md decision receipt plus NuGet parser/scanner receipts, passing tests, and a final audit confirming compatibility-layer boundaries."
  intake:
    original_request: "$goalbuddy:goal-prep after the plan to update windows.md with supported ecosystems and what to start with."
    interpreted_outcome: "Prepare a GoalBuddy board that executes the approved NuGet-first Windows-native ecosystem plan safely and keeps the fork maintainable."
    input_shape: existing_plan
    audience: "TakeThree Windows compatibility fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "windows.md records the Goal 10 support decisions, NuGet project/deep parsing is implemented, focused tests and go test pass, and a final audit confirms the work remains a compatibility layer."
    likely_misfire: "Adding broad Windows installed-app inventory or command/API discovery instead of file-based ecosystem metadata parsing."
    blind_spots_considered:
      - "NuGet global cache baseline roots can flood output and need a separate cache-semantics decision."
      - "PowerShell module support is in scope but has parser and ecosystem-naming risk."
      - "Chocolatey, Scoop, winget/MSIX/AppX, and Visual Studio extensions are app/tooling inventory, not the first developer package metadata slice."
      - "Cargo, Maven, and Gradle should be shared cross-platform parser goals, not Windows-specific work."
    existing_plan_facts:
      - "NuGet is first, using packages.config and packages.lock.json."
      - "PowerShell modules are second, with manifest parsing design before implementation."
      - "Chocolatey, Scoop, winget/MSIX/AppX, and Visual Studio extensions are deferred/unsupported for this phase."
      - "Cargo, Maven, and Gradle are cross-platform follow-ups."
      - "No NuGet global cache baseline root is added in the first slice."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: none
  local:
    status: not_requested
    url: null
    command: "goalbuddy board docs/goals/windows-native-ecosystem-scope"

active_task: null

tasks:
  - id: T001
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Update Goal 10 in windows.md with the approved Windows-native ecosystem support decisions and concrete next parser tasks."
    inputs:
      - "windows.md Goal 10"
      - "Approved plan: NuGet first, PowerShell second, Chocolatey/Scoop/winget/MSIX/AppX/Visual Studio deferred, Cargo/Maven/Gradle cross-platform follow-ups."
    constraints:
      - "Only edit windows.md."
      - "Do not claim implemented NuGet or PowerShell support yet."
      - "Keep wording aligned with the compatibility-layer principle."
      - "Document unsupported/deferred ecosystems explicitly."
    allowed_files:
      - "windows.md"
    verify:
      - "rg -n \"Goal 10|NuGet|PowerShell modules|Chocolatey|Scoop|winget|Visual Studio|Cargo|Maven|Gradle|packages.config|packages.lock.json\" windows.md"
      - "git diff -- windows.md"
    stop_if:
      - "Support-scope wording would contradict the existing compatibility-layer principle."
      - "Need to edit user-facing docs before the parser exists."
    receipt:
      result: done
      changed_files:
        - "windows.md"
      commands:
        - cmd: "rg -n \"Goal 10|NuGet|PowerShell modules|Chocolatey|Scoop|winget|Visual Studio|Cargo|Maven|Gradle|packages.config|packages.lock.json|decisions are still open|Native ecosystem boundary\" windows.md"
          status: pass
        - cmd: "git diff -- windows.md"
          status: pass
      summary: "Goal 10 now records the support decisions: NuGet first, PowerShell modules second after manifest-parser design, Chocolatey/Scoop/winget/MSIX/AppX/Visual Studio deferred or out of scope for this phase, and Cargo/Maven/Gradle as cross-platform follow-ups. The later native ecosystem boundary text was updated so it no longer says the decisions are still open."
