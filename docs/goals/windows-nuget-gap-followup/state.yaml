# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows NuGet Gap Follow-Up"
  slug: "windows-nuget-gap-followup"
  kind: existing_plan
  tranche: "Close useful NuGet validation gaps: requested_spec, persisted smoke coverage, and intentional-boundary docs."
  status: done
  oracle:
    signal: "NuGet requested ranges appear in requested_spec, scripts/windows-smoke.ps1 proves NuGet package data from a path with spaces, docs describe intentional boundaries, and vet/tests/race/smoke pass."
    cadence: "after the Worker package and at final audit"
    final_proof: "Worker receipt with changed files, full verification commands, smoke summary evidence, and final audit confirming compatibility-layer scope."
  intake:
    original_request: "$goalbuddy:goal-prep after the plan for the NuGet data gaps."
    interpreted_outcome: "Prepare a board to close the useful NuGet gaps without expanding Windows support beyond the compatibility layer."
    input_shape: existing_plan
    audience: "TakeThree Windows compatibility fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "NuGet lockfile requested ranges are emitted through requested_spec, Windows smoke proves NuGet data shape with redacted output, docs record intentional non-gaps, and the full validation suite passes."
    likely_misfire: "Treating intentional NuGet boundaries as a reason to add broad cache/app inventory or new schema instead of a small metadata-focused follow-up."
    blind_spots_considered:
      - "PowerShell 5.1 Start-Process argument handling can split paths with spaces."
      - "requested_spec is currently documented as MCP-oriented but already exists in the public schema."
      - "packages.config direct_dependency should remain empty because the file does not reliably encode dependency intent."
      - "Duplicate package/version records from packages.config and packages.lock.json are source-accurate, not necessarily a scanner bug."
    existing_plan_facts:
      - "Emit packages.lock.json requested ranges through requested_spec."
      - "Do not emit contentHash or target framework in this slice."
      - "Add a NuGet fixture to scripts/windows-smoke.ps1 under a path with spaces."
      - "Fix smoke command invocation so paths with spaces survive under Windows PowerShell 5.1."
      - "Document intentional non-gaps and keep NuGet global cache baseline roots deferred."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
