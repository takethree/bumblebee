        - cmd: "go test ./internal/ecosystem/nuget ./internal/scanner"
          status: pass
        - cmd: "go test ./cmd/bumblebee ./internal/..."
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "git diff --check"
          status: pass
        - cmd: "rg redaction scan for raw local username/SID/profile path and known local package names in touched docs/state"
          status: pass
      privacy_guard:
