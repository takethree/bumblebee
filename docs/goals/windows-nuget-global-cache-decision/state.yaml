        - "Only aggregate local cache counts from T001 were recorded."
      scope_guard:
        - "No NuGet global cache baseline root was added."
        - "No .nuspec, .nupkg, project.assets.json, registry/config discovery, command execution, Visual Studio API support, schema field, or CLI flag was added."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the NuGet global cache decision tranche is complete."
