# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows NuGet Global Cache Decision"
  slug: "windows-nuget-global-cache-decision"
  kind: existing_plan
  tranche: "Close the deferred NuGet global package-cache baseline-root item as a source-backed compatibility-layer decision."
  status: done
  oracle:
    signal: "Official NuGet cache behavior is verified, local cache volume is recorded only as aggregate counts, current parser scope is confirmed, docs do not overclaim cache inventory, and verification passes."
    cadence: "after Scout source/repo evidence mapping, after Judge decision, after Worker docs/test updates, and at final audit"
    final_proof: "Receipts list official NuGet sources, aggregate cache volume, current parser/dispatch scope, changed docs, verification commands, and final audit with full_outcome_complete=true."
  intake:
    original_request: "$goalbuddy:goal-prep for the NuGet global cache baseline-root decision plan."
    interpreted_outcome: "Prepare a GoalBuddy board that decides whether NuGet global cache roots belong in Windows baseline and updates support docs without accidental cache inventory implementation."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: source_backed_answer
    completion_proof: "Official NuGet docs, aggregate local cache evidence, parser/dispatch inspection, docs updates, Go tests, diff checks, and final audit."
    likely_misfire: "Adding %USERPROFILE%\\.nuget\\packages as a baseline root without a cache parser, or implying Bumblebee inventories installed/cache-state packages."
    blind_spots_considered:
      - "NuGet global package cache is expanded cache state and can be overridden."
      - "Cache contents may be stale or manually cleaned."
      - "Current parser only reads project/deep metadata files."
      - "Local cache volume can be large; aggregate counts must avoid package-name leakage."
    existing_plan_facts:
      - "Recommended default is to close the item as revisited and intentionally deferred."
      - "No baseline root or parser should be added in this tranche."
      - "Future cache support would need a separate parser/source-type design."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-nuget-global-cache-decision"
    last_error: "npx goalbuddy board exited without generating a board; fetch of https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json returned HTTP 404."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map official NuGet cache behavior, current Bumblebee NuGet parser scope, and aggregate local cache volume before any docs decision."
    inputs:
      - "docs/goals/windows-nuget-global-cache-decision/goal.md"
      - "windows.md Goal 10"
      - "docs/inventory-sources.md NuGet section"
      - "internal/ecosystem/nuget"
      - "internal/scanner NuGet dispatch"
      - "Official NuGet cache/config docs"
    constraints:
      - "Read-only."
      - "Do not edit docs or implementation."
      - "Do not record local package names, versions, raw paths, or raw cache listings."
      - "Do not add roots, parser support, CLI flags, or schema fields."
    expected_output:
      - "Official source facts for global package folder, overrides, cache semantics, and cleanup/staleness."
      - "Current parser/dispatch capability."
      - "Aggregate-only local cache volume evidence, if cache exists."
      - "Decision candidates and risks for Judge."
    receipt:
      result: done
      summary: "Official NuGet docs describe the global packages folder as expanded downloaded package cache state, defaulting on Windows to %userprofile%\\.nuget\\packages, with override paths through NUGET_PACKAGES, globalPackagesFolder, repositoryPath, or RestorePackagesPath. The cache is manually cleanable and can be stale or redirected. Current Bumblebee NuGet support only dispatches packages.config and packages.lock.json project metadata, so adding the cache root alone would not produce meaningful cache inventory."
      evidence:
        - "Official Microsoft NuGet global packages/cache folder documentation."
        - "Official Microsoft nuget.config file reference."
        - "Official Microsoft NuGet configuration behavior documentation."
        - "internal/ecosystem/nuget/nuget.go"
        - "internal/scanner/scanner.go"
        - "Aggregate-only local cache volume command output."
      official_sources:
        - "https://learn.microsoft.com/en-us/nuget/consume-packages/managing-the-global-packages-and-cache-folders"
        - "https://learn.microsoft.com/en-us/nuget/reference/nuget-config-file"
        - "https://learn.microsoft.com/en-us/nuget/consume-packages/configuring-nuget-behavior"
      repo_evidence:
        - "internal/ecosystem/nuget/nuget.go: parser states project/deep metadata only: packages.config and packages.lock.json."
        - "internal/scanner/scanner.go: NuGet dispatch only sends nuget-packages-config and nuget-lock jobs."
        - "docs/inventory-sources.md: already says obj/project.assets.json and global package cache are generated/cache state needing separate decisions."
        - "windows.md Goal 10: global package-cache baseline roots remain the deferred item."
      aggregate_local_cache_evidence:
        exists: true
        package_id_directory_count: 779
        version_directory_count: 1540
        file_count: 36333
        approximate_bytes: 7589926441
        privacy_note: "Only aggregate counts were recorded; no package names, versions, raw paths, or raw listings were written."
      decision_candidates:
        - "implement_now: rejected by Scout evidence unless a cache parser/source-type design is added first."
        - "defer_by_design: recommended for this tranche; close the checklist item as revisited and intentionally not a baseline root."
        - "split_future_parser_plan: viable later if the product explicitly wants cache/installed-state inventory semantics."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Decide whether to implement, defer, or split NuGet global cache baseline-root work."
    inputs:
      - "T001 Scout receipt"
      - "Goal oracle"
      - "Compatibility-layer principle"
    constraints:
      - "Read-only."
      - "Reject any implementation path that adds a baseline root without meaningful parser output."
      - "Reject installed/cache-state inventory expansion without a separate design."
    expected_output:
      - "decision: implement_now | defer_by_design | split_future_parser_plan | blocked"
      - "rationale"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
    receipt:
      result: done
      decision: defer_by_design
      full_outcome_complete: false
      rationale: "Adding a NuGet global package-cache baseline root now would be misleading: official docs identify it as expanded cache state with override/cleanup behavior, and the current Bumblebee parser cannot emit meaningful records from cache folders without a separate cache parser/source-type design. Close the current item as source-backed deferral, not implementation."
      exact_worker_objective: "Update windows.md and docs/inventory-sources.md to record that NuGet global package-cache baseline roots were revisited and intentionally deferred, with official-source rationale and aggregate-only volume evidence."
      allowed_files:
        - "windows.md"
        - "docs/inventory-sources.md"
        - "docs/goals/windows-nuget-global-cache-decision/state.yaml"
      verify:
        - "rg -n \"\\.nuget\\\\packages|global package-cache|global-packages|project.assets|nuspec|nupkg\" windows.md docs README.md cmd internal"
        - "go test ./internal/ecosystem/nuget ./internal/scanner"
        - "go test ./cmd/bumblebee ./internal/..."
        - "go test ./..."
        - "git diff --check"
      stop_if:
        - "Need to add NuGet cache parser support, baseline roots, schema fields, CLI flags, registry/config discovery, command execution, or Visual Studio API support."
        - "Need files outside allowed_files."
        - "Need to record package names, versions, raw local cache paths, or raw cache listings."
        - "Verification fails twice for the same reason."

