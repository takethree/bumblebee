# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows PowerShell Module Manifests"
  slug: "windows-powershell-module-manifests"
  kind: existing_plan
  tranche: "Validate and implement PowerShell .psd1 module manifest inventory as the next Windows compatibility-layer slice."
  status: done
  oracle:
    signal: "windows.md Goal 10 has the PowerShell design item closed, CLI ecosystem help is accurate, and .psd1 manifests emit schema-compatible package records without executing PowerShell."
    cadence: "after plan validation, after Worker implementation, and at final audit"
    final_proof: "Task receipts list changed files and passing verification: focused Go tests, full Go tests, race tests, vet, Windows smoke, and diff hygiene."
  intake:
    original_request: "$goalbuddy:goal-prep for the approved next-step plan."
    interpreted_outcome: "Prepare a GoalBuddy board to implement PowerShell module manifest support carefully against windows.md."
    input_shape: existing_plan
    audience: "TakeThree Windows compatibility fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "Implementation, docs, smoke receipts, and final audit prove the PowerShell manifest slice works and stays within compatibility-layer boundaries."
    likely_misfire: "Treating PowerShell support as command/API/Gallery/package-manager discovery instead of bounded file metadata parsing."
    blind_spots_considered:
      - "Ecosystem naming must be explicit and downstream-safe."
      - ".psd1 parsing must not evaluate PowerShell expressions."
      - "Windows module roots may overlap redirected Documents or OneDrive, which remains out of scope."
      - "NuGet support has a user-visible help text drift to close before adding another ecosystem."
      - "Baseline roots must not become broad home or installed-app inventory."
    existing_plan_facts:
      - "First cleanup: list nuget in user-visible --ecosystem help and test against future drift."
      - "PowerShell records should use ecosystem=powershell-module, package_manager=powershell, source_type=powershell-module-manifest."
      - "Package name should come from the manifest basename without .psd1; version should come from top-level ModuleVersion."
      - "Parser must be file-based and conservative; no PowerShell execution, Gallery/API lookup, or command output."
      - "Windows baseline roots should add current-user and all-users PowerShell/WindowsPowerShell Modules directories only when present."
      - "Docs and smoke tests should claim only implemented behavior."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/"
    command: "node C:\\Users\\bbutner\\AppData\\Roaming\\npm\\node_modules\\goalbuddy\\goalbuddy\\extend\\local-goal-board\\scripts\\local-goal-board.mjs --goal docs/goals/windows-powershell-module-manifests --host goalbuddy.localhost --port 41737"

active_task: null

