        - "windows.md Goal 10 keeps PowerShell in scope after a .psd1 design pass and forbids PowerShell package-command discovery."
        - "cmd/bumblebee/main.go user-visible --ecosystem help omits nuget despite model support."
        - "internal/model/model.go and internal/scanner/scanner.go support adding a shared ecosystem parser without schema changes."
        - "cmd/bumblebee/roots_windows.go has the right hook for Windows-only module roots."
        - "Microsoft about_Module_Manifests documents .psd1 manifests and required ModuleVersion."
        - "Microsoft about_PSModulePath documents Windows user/all-users PowerShell and WindowsPowerShell module directories and redirected Documents caveat."
        - "OSV schema has NuGet but no PowerShell ecosystem, supporting a project-local powershell-module ecosystem value."
      worker_objective: "Implement the validated PowerShell module manifest inventory slice, including the NuGet help-text cleanup, parser, dispatch, Windows roots, docs, and smoke coverage."
