    type: pm
    assignee: PM
    status: done
    reasoning_hint: medium
    objective: "Validate the approved PowerShell manifest plan against windows.md, current code touchpoints, and official PowerShell docs before implementation."
    inputs:
      - "windows.md Goal 10 and Goal 12 boundaries"
      - "README.md and docs/inventory-sources.md support claims"
      - "Current model, scanner, root discovery, and NuGet parser patterns"
      - "Official PowerShell module manifest and PSModulePath documentation"
    constraints:
      - "Read-only except for updating this board receipt."
      - "Do not implement parser, roots, docs, or tests in this task."
      - "Preserve the approved compatibility-layer scope unless evidence proves it unsafe."
    expected_output:
      - "Decision: approved | revise | blocked"
      - "Final exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
    receipt:
      result: done
      decision: approved
      summary: "Validated the approved plan against windows.md, current model/scanner/root/smoke patterns, and official PowerShell docs. The next safe slice is one coherent Worker package: NuGet help text cleanup plus PowerShell manifest parser, dispatch, Windows roots, docs, smoke, and verification."
