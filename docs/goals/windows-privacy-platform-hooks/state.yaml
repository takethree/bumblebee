        - "Do not check new Goal 6 capability items."
      rejected_scope:
        - "Behavior changes, exported walk.DefaultExcludes API churn, parser/schema/CLI/root-kind/output changes, new inventory scope, junction/reparse/dirKey work, all-users, WSL, native ecosystems, and deployment docs."

