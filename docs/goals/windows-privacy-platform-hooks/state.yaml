      - "Reject behavior changes, exported API churn to walk.DefaultExcludes, parser/schema/CLI/root-kind/output changes, new inventory scope, junction/reparse/dirKey work, all-users, WSL, native ecosystems, and deployment docs."
      - "Approve only a behavior-preserving maintenance refactor with tests."
    expected_output:
