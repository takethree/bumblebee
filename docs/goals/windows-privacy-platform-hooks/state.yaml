      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "windows.md changes allowed"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      exact_worker_objective: "Refactor Goal 6A Windows privacy hardening behind platform hooks while preserving walk.DefaultExcludes as a variable and preserving Windows runtime behavior."
