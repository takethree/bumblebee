# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Privacy Platform Hooks"
  slug: "windows-privacy-platform-hooks"
  kind: existing_plan
  tranche: "Refactor Goal 6A Windows privacy hardening behind platform hooks without behavior changes."
  status: done
  oracle:
    signal: "Focused tests, full Go verification, race tests, and redacted Windows smoke prove Goal 6A behavior is preserved while Windows-specific policy moves out of shared walker/scanner bodies."
    cadence: "after Scout/Judge gate, after Worker implementation, and at final audit"
    final_proof: "Passing verification plus a Judge receipt mapping code-shape and behavior evidence to the maintenance-risk objective."
  intake:
    original_request: "GoalBuddy-prep the maintenance change to reduce divergence from base Bumblebee."
    interpreted_outcome: "A runnable GoalBuddy board exists for refactoring Windows privacy hardening behind compatibility-layer platform hooks."
    input_shape: existing_plan
    audience: "Bumblebee maintainers reviewing the Windows fork and future upstream rebases"
    authority: requested
    proof_type: test
    completion_proof: "Code-shape inspection, focused tests, full test/race verification, Windows smoke, and windows.md update prove the refactor."
    likely_misfire: "Changing scanner behavior, widening Windows support, or removing Goal 6A protections while trying to reduce maintenance risk."
    blind_spots_considered:
      - "walk.DefaultExcludes is exported; avoid turning it into a function unless absolutely necessary."
      - "Windows-only AppData and OneDrive policy currently increases shared-code conflict risk."
      - "Scanner-sensitive-file skipping must remain before files_considered."
      - "Non-Windows should not unexpectedly inherit Windows-only policy."
      - "Current dirty worktree includes previous Windows compatibility slices; do not revert unrelated changes."
    existing_plan_facts:
      - "Preserve walk.DefaultExcludes as an exported variable."
      - "Move Windows-only walker excludes and dynamic matching into platform-specific files."
      - "Move Windows browser profile path literals out of shared scanner.go."
      - "No intended runtime behavior change."
      - "Update windows.md only as maintenance/fork-hygiene evidence, not new Goal 6 capability completion."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-privacy-platform-hooks/"
    command: "npx goalbuddy board docs/goals/windows-privacy-platform-hooks"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the exact Windows-specific policy currently embedded in shared walker/scanner code and the safest platform-hook boundaries."
    inputs:
      - "docs/goals/windows-privacy-platform-hooks/goal.md"
      - "windows.md"
      - "internal/walk/walk.go"
      - "internal/walk/walk_test.go"
      - "internal/scanner/scanner.go"
      - "internal/scanner/scanner_test.go"
      - "scripts/windows-smoke.ps1"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not inspect raw browser inventories or raw NDJSON except aggregate redacted smoke evidence."
      - "Keep parser/schema/CLI/root-kind/output behavior, new inventory scope, junction/reparse, dirKey, ACL-denied tests, all-users, WSL, and native ecosystems out of the recommended Worker package."
    expected_output:
      - "Current Windows literals/policy in shared code"
      - "Recommended platform-hook function names and files"
      - "Tests to preserve Windows behavior"
      - "Tests to prove non-Windows does not inherit Windows-only policy"
      - "windows.md update recommendation"
      - "Recommended Worker package"
    receipt:
      result: done
      summary: "Windows-specific privacy policy is concentrated in shared internal/walk/walk.go and internal/scanner/scanner.go; the safest boundary is platform hook files while preserving walk.DefaultExcludes as a variable."
      evidence:
        - "internal/walk/walk.go embeds AppData, OneDrive, Google Drive, Dropbox, isCloudSyncDir, and Firefox profile sensitive-subtree matching inline."
        - "internal/scanner/scanner.go calls isSensitiveBrowserProfileFile before files_considered, but embeds Windows AppData browser profile markers inline."
        - "internal/walk/walk_test.go and internal/scanner/scanner_test.go already contain behavior tests that can be kept in shared test files with OS-aware assertions."
        - "windows.md has a Goal 6A smoke receipt; this refactor should add fork-hygiene evidence without checking new capability items."
      recommended_hooks:
        - "internal/walk/excludes_windows.go: platformDefaultExcludes and isPlatformExcludedDir."
        - "internal/walk/excludes_nonwindows.go: nil/false platform hooks."
        - "internal/scanner/sensitive_windows.go: isSensitiveBrowserProfileFile with Windows browser profile markers."
        - "internal/scanner/sensitive_nonwindows.go: false sensitive-file hook."
      recommended_worker_package:
        - "Split sharedDefaultExcludes from DefaultExcludes and append platformDefaultExcludes at initialization."
        - "Replace inline walk dynamic matching with isPlatformExcludedDir."
        - "Move scanner sensitive-browser path matching to platform-specific files."
        - "Adjust tests to prove Windows behavior on Windows and non-Windows non-inheritance where those tests run."
        - "Update windows.md as maintenance/fork-hygiene evidence only."

