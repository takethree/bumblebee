# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Python Install Roots Compatibility Slice"
  slug: "windows-python-install-roots"
  kind: existing_plan
  tranche: "Complete the source-backed Windows Python install-root baseline slice end to end."
  status: done
  oracle:
    signal: "Goal 3 records the Python install-root slice as implemented only after source evidence, code/docs changes, Go tests, and Windows smoke verification prove supported roots populate correctly without broad Python discovery."
    cadence: "after Scout source validation, after the Worker implementation package, and at final audit"
    final_proof: "Receipts show source-backed scope, changed files, passing verification commands, docs updates, and no unsupported baseline discovery."
  intake:
    original_request: "$goalbuddy:goal-prep"
    interpreted_outcome: "Prepare a GoalBuddy board to implement the planned Goal 3 Windows Python install-root compatibility slice carefully and verifiably."
    input_shape: existing_plan
    audience: "Windows Bumblebee compatibility-layer fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "Supported Python install roots are implemented, documented, and verified by focused Go tests plus the Windows smoke suite."
    likely_misfire: "Implementing broad Python environment discovery, command execution, registry probing, or custom-prefix scanning instead of a narrow source-backed compatibility-layer baseline."
    blind_spots_considered:
      - "Official Python installer defaults versus locally observed custom prefixes."
      - "False positives from arbitrary C:\\Python* roots."
      - "Store/MSIX, Conda, pyenv-win, custom PYTHONPATH, and custom PYTHONUSERBASE layouts."
      - "Smoke fixtures must not write into real Python installs."
    existing_plan_facts:
      - "Keep existing %APPDATA%\\Python\\Python*\\site-packages user-site support."
      - "Add %LOCALAPPDATA%\\Programs\\Python\\Python*\\Lib\\site-packages as user_package_root if source validation confirms the installer/sysconfig basis."
      - "Add %ProgramFiles%\\Python*\\Lib\\site-packages and %ProgramFiles(x86)%\\Python*\\Lib\\site-packages as global_package_root if source validation confirms the installer/sysconfig basis."
      - "Do not add arbitrary C:\\Python* baseline roots in this slice."
      - "Do not execute Python, py, pip, uv, registry APIs, or package-manager commands during scanning."
      - "Keep arbitrary virtualenv discovery, Conda, pyenv-win, Store/MSIX internals, custom PYTHONPATH, and custom PYTHONUSERBASE deferred or explicit-root only."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-python-install-roots/"
    command: "goalbuddy board docs/goals/windows-python-install-roots"
    error: "Installed goalbuddy board command failed before serving because catalog fetch returned HTTP 404; file board remains usable."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Validate the source basis and exact support boundary for Windows Python install-root baseline candidates."
    inputs:
      - "windows.md Goal 3"
      - "docs/inventory-sources.md Python baseline documentation"
      - "Official Python Windows installer docs"
      - "Official Python sysconfig docs"
      - "Official Python site docs"
      - "cmd/bumblebee Windows root code and tests"
    constraints:
      - "Read-only."
      - "Do not edit implementation or docs."
      - "Use official Python sources for support claims."
      - "Separate officially sourced defaults from locally observed/custom prefixes."
    expected_output:
      - "Supported path patterns with root_kind decisions."
      - "Explicit excluded/deferred path patterns."
      - "Implementation file set and risk notes."
      - "Worker allowed_files, verify commands, and stop_if conditions."
    receipt:
      result: done
      summary: "Official Python docs support the planned static root slice: Windows installer defaults include just-for-me installs under %LOCALAPPDATA%\\Programs\\Python\\Python* and all-user installs under %ProgramFiles% / %ProgramFiles(x86)%, while sysconfig's Windows nt prefix scheme places purelib/platlib under prefix\\Lib\\site-packages. Existing %APPDATA% user-site support remains backed by site.USER_SITE."
      evidence:
        - "https://docs.python.org/3/using/windows.html#installing-without-ui"
        - "https://docs.python.org/3/library/sysconfig.html#nt"
        - "https://docs.python.org/3/library/site.html#site.USER_SITE"
      supported_patterns:
        - "%LOCALAPPDATA%\\Programs\\Python\\Python*\\Lib\\site-packages => user_package_root"
        - "%ProgramFiles%\\Python*\\Lib\\site-packages => global_package_root"
        - "%ProgramFiles(x86)%\\Python*\\Lib\\site-packages => global_package_root"
      deferred_patterns:
        - "Arbitrary C:\\Python* custom prefixes"
        - "Python Install Manager dynamic/managed-runtime enumeration"
        - "Registry-discovered runtimes"
        - "Conda, pyenv-win, Store/MSIX internals, custom PYTHONPATH, and custom PYTHONUSERBASE"
      spawned_tasks:
        - T002
  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Implement the approved source-backed Windows Python install-root baseline slice and update tests/docs."
    allowed_files:
      - "cmd/bumblebee/roots.go"
      - "cmd/bumblebee/roots_windows.go"
      - "cmd/bumblebee/main_windows_test.go"
      - "scripts/windows-smoke.ps1"
      - "windows.md"
      - "docs/inventory-sources.md"
    verify:
      - "go test ./cmd/bumblebee ./internal/ecosystem/pypi ./internal/scanner"
      - "go test ./..."
      - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Official source validation contradicts the planned path patterns."
      - "Implementation would require scan-time command execution, registry discovery, or broad filesystem crawling."
      - "Smoke coverage would require writing into a real Python install directory."
      - "Verification fails twice for the same unresolved reason."
    receipt:
      result: done
      changed_files:
        - "cmd/bumblebee/roots.go"
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/main_windows_test.go"
        - "scripts/windows-smoke.ps1"
        - "windows.md"
        - "docs/inventory-sources.md"
      commands:
        - cmd: "go test ./cmd/bumblebee ./internal/ecosystem/pypi ./internal/scanner"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Implemented source-backed Windows Python install-prefix baseline roots for %LOCALAPPDATA%\\Programs\\Python and Program Files locations, added root-kind classification, extended unit coverage, updated the strict-parity smoke fixture, and documented supported/deferred boundaries. Go was installed from the official go.dev download feed and the archive SHA-256 matched the published checksum before verification."
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review whether the implemented Python install-root slice stays within compatibility-layer scope and does not create maintenance divergence from upstream Bumblebee."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "Current diff"
      - "Verification output"
      - "windows.md Goal 3"
    constraints:
      - "Do not implement."
      - "Prefer maintainability and source-backed scope over broad local coverage."
      - "Reject undocumented behavior changes or unsupported root discovery."
    expected_output:
      - "approved | changes_required"
      - "Compatibility-layer compliance assessment"
      - "Maintenance-risk assessment"
      - "Required follow-up tasks if not approved"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      summary: "The implementation remains a compatibility-layer baseline expansion: static source-backed roots only, no command execution, no registry probing, no broad custom-prefix scan, and no parser/output schema changes. Shared code change in roots.go is limited to the existing Windows systemRoots branch because Program Files roots are emitted once per scan there."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the Windows Python install-root compatibility slice satisfies the original owner outcome for this tranche."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md Goal 3"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if docs and tests do not agree on the supported root boundary."
      - "Reject completion if broad Python discovery, custom-prefix scanning, registry probing, or command execution was added."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The tranche is complete: source evidence is recorded, supported Python install roots are implemented and documented, unsupported Python discovery remains deferred, focused Go tests and full Go tests passed, the Windows smoke strict-parity fixture emitted the new Python install package, and git diff --check passed."

checks:
  dirty_fingerprint: unknown
  last_verification:
    result: pass
    task: T002
    commands:
      - "go test ./cmd/bumblebee ./internal/ecosystem/pypi ./internal/scanner"
      - "go test ./..."
      - "powershell -NoProfile -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
      - "git diff --check"
