# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Record-ID Drift"
  slug: "windows-record-id-drift"
  kind: existing_plan
  tranche: "Close the record_id path-separator drift risk and update only proven Windows checklist evidence."
  status: done
  oracle:
    signal: "Separator-equivalent path identity records produce identical record_id values, different path content still changes IDs, emitted JSON remains native, docs/checklists reflect only verified facts, and verification commands pass."
    cadence: "after Worker implementation and at final audit"
    final_proof: "Passing tests/build/selftest plus a Judge receipt mapping windows.md checkboxes and changed files to the record-ID drift plan."
  intake:
    original_request: "Come up with a plan for the next careful Windows support slice from windows.md."
    interpreted_outcome: "A GoalBuddy board exists to execute the record-ID drift slice without widening into baseline Windows discovery."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and downstream inventory consumers"
    authority: requested
    proof_type: test
    completion_proof: "Record-ID separator-drift tests pass, docs explain identity-only normalization, and windows.md marks only verified items complete."
    likely_misfire: "Normalizing emitted JSON paths, case-folding paths without a policy decision, or starting baseline/browser/all-users Windows discovery before the core identity question is closed."
    blind_spots_considered:
      - "Package and finding IDs include source_file/project_path."
      - "Diagnostic IDs include path."
      - "Scan summary IDs include root paths."
      - "Existing golden IDs must remain stable for Unix-style paths unless the Judge approves a documented intentional churn."
      - "Path separator normalization must not change emitted records or public schema."
      - "Case-insensitive Windows path equivalence is a separate policy decision."
    existing_plan_facts:
      - "Add an internal model helper for identity hashing only."
      - "Apply it only to path-bearing identity fields."
      - "Preserve emitted JSON paths exactly as observed."
      - "Preserve case in this slice."
      - "Update docs/state-model.md with identity-only path normalization."
      - "Update windows.md only for proven Goal 2 and Goal 12 items."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-record-id-drift/"
    command: "npx goalbuddy board docs/goals/windows-record-id-drift"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the record-ID drift plan and approve or narrow the Worker package."
    inputs:
      - "docs/goals/windows-record-id-drift/goal.md"
      - "windows.md"
      - "docs/state-model.md"
      - "internal/model/model.go"
      - "internal/model/model_test.go"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve the compatibility-layer boundary."
      - "Reject emitted path normalization, schema changes, parser changes, CLI changes, or case-folding unless explicitly justified as required."
      - "Reject any task that starts Windows baseline roots, browser roots, all-users, WSL, deployment docs, or native ecosystem support."
    expected_output:
      - "Decision: approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Any deferred follow-up tasks"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The plan is bounded to identity-only path separator normalization. Current StableID implementations include path-bearing fields for package, finding, scan_summary, and diagnostic records, so a focused model-level change plus docs/checklist updates is the right Worker slice."
      worker_task: T002
      allowed_files:
        - "internal/model/model.go"
        - "internal/model/model_test.go"
        - "docs/state-model.md"
        - "windows.md"
      verify:
        - "go test ./..."
        - "go test -race ./..."
        - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
        - "./bumblebee.exe selftest"
        - "git diff --check"
      stop_if:
        - "Need files outside allowed_files."
        - "Need emitted JSON path normalization or schema/parser/CLI/root-kind/profile changes."
        - "Need case-folding policy."
      deferred_followups:
        - "Case-insensitive Windows path identity policy."
        - "Windows baseline roots and browser roots."
        - "Windows all-users, WSL, deployment docs, and native ecosystem scope."

  - id: T002
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement identity-only path separator normalization for record_id generation and update the matching docs/checklist evidence."
    allowed_files:
      - "internal/model/model.go"
      - "internal/model/model_test.go"
      - "docs/state-model.md"
      - "windows.md"
    verify:
      - "go test ./..."
      - "go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee"
      - "./bumblebee.exe selftest"
      - "git diff --check"
    stop_if:
      - "Need files outside allowed_files."
      - "Need to change public schema files, emitted JSON path values, parser behavior, root kinds, profile names, ecosystem names, sink behavior, or CLI flags."
      - "Need to case-fold paths or otherwise decide case-insensitive path identity."
      - "Existing stable-ID golden values must change for non-path or Unix-style identity inputs."
      - "Verification fails twice for unclear reasons."
    receipt:
      result: done
      changed_files:
        - "internal/model/model.go"
        - "internal/model/model_test.go"
        - "docs/state-model.md"
        - "windows.md"
      commands:
        - cmd: "gofmt -w internal/model/model.go internal/model/model_test.go"
          status: pass
        - cmd: "go test ./..."
          status: pass
        - cmd: "CGO_ENABLED=1 go test -race ./..."
          status: pass
        - cmd: "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
          status: pass
        - cmd: "git diff --check"
          status: pass
      summary: "Added identity-only path canonicalization for record_id path fields, covered package/finding/scan_summary/diagnostic separator equivalence plus distinct-path non-collapse, documented identity-only normalization, and checked only verified windows.md items."
      scope_guard:
        - "No schema, parser, sink, root-kind, profile, CLI, or emitted JSON path normalization changes."
        - "No path case-folding policy added."
        - "No Windows baseline/browser/all-users/WSL/deployment/native ecosystem work added."

  - id: T003
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and checklist tracking after the Worker package."
    inputs:
      - "T002 receipt"
      - "windows.md"
    constraints:
      - "Only update GoalBuddy control files unless T002 already updated windows.md."
      - "Do not claim checklist items complete without test or smoke-run proof."
    expected_output:
      - "Board state updated"
      - "Remaining Windows support gaps listed if any"
    receipt:
      result: done
      summary: "Board receipts and checklist tracking are current. windows.md now marks the record-ID drift item complete and checks only the local Windows smoke items already proven by prior/current verification."
      completed_checklist_items:
        - "Goal 2: Check record IDs for undesirable drift caused only by path separator differences."
        - "Goal 12: Build bumblebee.exe locally on Windows."
        - "Goal 12: Run bumblebee.exe selftest."
        - "Goal 12: Run an explicit-root project scan against a fixture repo."
        - "Goal 12: Run a file output smoke test with append mode."
        - "Goal 12: Confirm scan_summary.status=complete for healthy runs."
      remaining_windows_gaps:
        - "Minimum supported Windows versions."
        - "Windows baseline roots and baseline roots tests."
        - "Windows browser extension roots and tests."
        - "Windows multi-user scanning policy."
        - "Windows walker hardening around junctions/reparse points/excludes."
        - "Windows endpoint identity documentation/tests."
        - "Windows deployment and user-facing docs."
        - "Windows-native ecosystem scope."
        - "WSL behavior policy."
        - "Real-profile baseline/browser/MCP/HTTP end-to-end smoke tests."

  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Audit whether the record-ID drift tranche is complete."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "windows.md"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if tests do not prove separator-equivalent ID stability and distinct-path non-collapse."
      - "Reject completion if emitted JSON paths, schema, parsers, CLI flags, root kinds, or profile meanings changed."
      - "Reject completion if scope widened beyond record-ID drift and verified checklist cleanup."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      prompt_to_artifact_checklist:
        - requirement: "Prove separator-equivalent paths produce identical record_id values."
          evidence: "internal/model/model_test.go includes TestStableIDNormalizesPathSeparatorsForIdentityOnly covering package, finding, scan_summary, and diagnostic IDs."
        - requirement: "Prove different path content still changes IDs."
          evidence: "internal/model/model_test.go includes TestStableIDPathNormalizationDoesNotCollapseDifferentPaths."
        - requirement: "Do not normalize emitted JSON paths."
          evidence: "StableID test asserts package ProjectPath and SourceFile are unchanged after StableID; implementation applies identityPath only inside StableID tuple construction."
        - requirement: "Document identity-only path normalization."
          evidence: "docs/state-model.md documents separator normalization and . / .. cleaning for hashing only, with emitted JSON paths preserved."
        - requirement: "Update windows.md only for verified checklist items."
          evidence: "windows.md checks Goal 2 record-ID drift and only previously/currently proven Goal 12 local smoke items; broader baseline/browser/MCP/HTTP/WSL/deployment/native ecosystem work remains unchecked."
        - requirement: "Run required verification commands."
          evidence: "T002 receipt records passing go test ./..., CGO_ENABLED=1 go test -race ./..., Windows build+selftest, and git diff --check."
        - requirement: "Avoid scope widening."
          evidence: "No schema files, parser behavior, sink behavior, CLI flags, root kinds, profile meanings, Windows baseline roots, browser roots, all-users, WSL, deployment docs, or native ecosystem work changed in this tranche."
      residual_risk:
        - "Case-insensitive Windows path identity remains deferred by design."
        - "Remote GitHub Actions jobs are still not local evidence for this tranche."

checks:
  dirty_fingerprint: "record-id drift slice plus previous Windows core compatibility changes"
  last_verification:
    result: pass
    task: T002
    commands:
      - "go test ./..."
      - "CGO_ENABLED=1 go test -race ./..."
      - "go build -buildvcs=false -o ./bumblebee.exe ./cmd/bumblebee && ./bumblebee.exe selftest"
      - "git diff --check"
