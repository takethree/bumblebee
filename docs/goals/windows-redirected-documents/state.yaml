# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Goal 6A Redirected Documents Compatibility"
  slug: "windows-redirected-documents"
  kind: existing_plan
  tranche: "Support the current user's resolved Windows Documents known-folder path for PowerShell module baseline roots without broadening the compatibility-layer model."
  status: done
  oracle:
    signal: "Windows baseline roots include the current user's resolved Documents known-folder path for PowerShell module roots; tests and smoke prove redirected/fallback/de-dupe boundaries; docs state unsupported all-users/registry/domain/OneDrive discovery."
    cadence: "after source validation, after Worker implementation, and at final audit"
    final_proof: "Receipts list source-backed decisions, changed files, focused tests, full tests, Windows smoke, docs updates, and final audit with full_outcome_complete=true."
  intake:
    original_request: "$goalbuddy:goal-prep for the next target: Windows Goal 6A redirected Documents compatibility."
    interpreted_outcome: "Prepare a GoalBuddy board to implement current-user redirected Documents support for Windows PowerShell module baseline roots as a narrow compatibility-layer tranche."
    input_shape: existing_plan
    audience: "Windows compatibility fork maintainer"
    authority: approved
    proof_type: test
    completion_proof: "Source validation, focused tests, go test ./..., Windows smoke, git diff --check, docs updates, and final audit prove the tranche is complete."
    likely_misfire: "Treating redirected Documents as permission to crawl OneDrive broadly or add registry/SID/domain/Azure AD all-users profile discovery."
    blind_spots_considered:
      - "All-users redirected known folders need user-token or registry/hive behavior and remain out of scope."
      - "Broad OneDrive folders are currently excluded for privacy; explicit curated roots must still be allowed."
      - "Hosts without redirected Documents need deterministic fallback behavior."
      - "Known-folder lookup may fail or be unavailable."
      - "Resolved Documents can duplicate %USERPROFILE%\\Documents."
    existing_plan_facts:
      - "Use Windows known-folder resolution for the current user's Documents path."
      - "Keep %USERPROFILE%\\Documents fallback."
      - "Use a de-duplicated union of Documents candidates for PowerShell module baseline roots."
      - "Do not add registry reads, SID enumeration, token impersonation, WMI, domain/Azure AD discovery, or broad OneDrive crawling."
      - "Do not claim all-users redirected known-folder support."
      - "Update README, docs/deployment-windows.md, docs/inventory-sources.md, and windows.md."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-redirected-documents"
    last_error: "npx goalbuddy board exited without generating .goalbuddy-board; fetch of https://raw.githubusercontent.com/tolibear/goalbuddy/main/extend/catalog.json returned HTTP 404."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Source-validate the redirected Documents plan and map exact implementation boundaries before code changes."
    inputs:
      - "docs/goals/windows-redirected-documents/goal.md"
      - "windows.md Goal 6 and current support boundary"
      - "Current root discovery and Windows platform hooks"
      - "Official Microsoft known-folder and PowerShell module-path documentation"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Do not implement registry, SID, domain, Azure AD, token impersonation, WMI, package-manager command, or broad OneDrive crawling."
      - "Do not change schema, parser behavior, profile semantics, or root-kind names."
    expected_output:
      - "approved | revise_plan | blocked"
      - "Exact Windows API/source evidence"
      - "Implementation boundary for current-user vs all-users"
      - "Allowed files for Worker"
      - "Verify commands"
      - "Stop-if conditions"
    receipt:
      result: done
      decision: approved
      summary: "Source validation supports a narrow current-user Documents known-folder slice. PowerShell CurrentUser module roots are defined under the user's Documents folder, and Microsoft documents that folder redirection/OneDrive can change that location. SHGetKnownFolderPath can retrieve FOLDERID_Documents for the current user with hToken=NULL; using another user's token/hive is explicitly a broader privileged path and remains out of scope."
      evidence:
        - "Microsoft about_PSModulePath: CurrentUser PowerShell modules on Windows live under $HOME\\Documents\\PowerShell\\Modules; Windows PowerShell 5.1 uses $HOME\\Documents\\WindowsPowerShell\\Modules; the specific Documents location varies with folder redirection and OneDrive, and [Environment]::GetFolderPath('MyDocuments') verifies it."
        - "Microsoft SHGetKnownFolderPath docs: hToken=NULL requests the known folder for the current user; specific-user lookup requires a user token and mounted registry hive."
        - "Microsoft KNOWNFOLDERID docs: FOLDERID_Documents is a PERUSER known folder with default path %USERPROFILE%\\Documents."
        - "Current code uses %USERPROFILE%\\Documents literally for Windows PowerShell module roots, so redirected current-user Documents can be missed."
        - "Current walker already prunes broad OneDrive/cloud-sync directories under broad roots; explicit curated roots remain the right compatibility-layer mechanism."
      citations:
        - "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_psmodulepath"
        - "https://learn.microsoft.com/en-us/windows/win32/api/shlobj_core/nf-shlobj_core-shgetknownfolderpath"
        - "https://learn.microsoft.com/en-us/windows/win32/shell/knownfolderid"
      implementation_boundary:
        current_user: "Resolve the current user's Documents known-folder path and add PowerShell/Modules plus WindowsPowerShell/Modules candidates when present, de-duplicated with %USERPROFILE%\\Documents."
        all_users: "Keep <home>\\Documents only; do not query other users' tokens, registry hives, SIDs, domain/Azure AD profiles, or OneDrive state."
        fallback: "If known-folder lookup fails or returns empty, keep existing %USERPROFILE%\\Documents behavior."
      worker_allowed_files:
        - "cmd/bumblebee/roots_windows.go"
        - "cmd/bumblebee/main_windows_test.go"
        - "scripts/windows-smoke.ps1"
        - "README.md"
        - "docs/deployment-windows.md"
        - "docs/inventory-sources.md"
        - "windows.md"
        - "docs/goals/windows-redirected-documents/state.yaml"
      verify:
        - "go test ./cmd/bumblebee"
        - "go test ./cmd/bumblebee ./internal/walk ./internal/scanner"
        - "go test ./..."
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check"
      stop_if:
        - "Need registry, SID, domain, Azure AD, token impersonation, WMI, package-manager command, or broad OneDrive crawling."
        - "Need schema, parser, profile, ecosystem, root-kind, or output-shape changes."
        - "Need all-users redirected Documents discovery."
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review T001 and approve the largest safe Worker package for redirected Documents compatibility."
    inputs:
