        - "No junction/reparse, dirKey, all-users, WSL, native ecosystem, parser/schema/output/CLI/root-kind, endpoint identity, or deployment behavior changed."
        - "OneDrive and OneDrive - <tenant> pruning is implemented, but broader redirected-known-folder policy remains open."

  - id: T004
    type: pm
    assignee: PM
    status: done
    reasoning_hint: default
    objective: "Refresh board receipts and windows.md tracking after the Worker package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "T003 receipt"
      - "windows.md"
    constraints:
