# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Walker Privacy Hardening"
  slug: "windows-walker-privacy-hardening"
  kind: existing_plan
  tranche: "Implement Goal 6A privacy-first Windows walker hardening only."
  status: done
  oracle:
    signal: "Focused tests, full Go verification, race tests, and redacted Windows smoke prove sensitive Windows paths are pruned without breaking intended metadata discovery."
    cadence: "after Scout/Judge gate, after Worker implementation, and at final audit"
    final_proof: "Passing verification plus a Judge receipt mapping windows.md Goal 6 checkbox changes to proven privacy-hardening behavior."
  intake:
    original_request: "GoalBuddy-prep the privacy-first Windows walker hardening plan."
    interpreted_outcome: "A runnable GoalBuddy board exists for Goal 6A: harden Windows walker privacy boundaries as a compatibility-layer slice."
    input_shape: existing_plan
    audience: "Bumblebee maintainers and Windows endpoint operators"
    authority: requested
    proof_type: test
    completion_proof: "Walker/scanner regression tests, full test/race verification, Windows smoke, and windows.md updates prove the tranche."
    likely_misfire: "Completing all Goal 6 items, redesigning Windows reparse/junction identity, changing schemas/parsers/CLI, adding new inventory scope, or pruning so broadly that intended metadata discovery breaks."
    blind_spots_considered:
      - "Firefox profile-parent roots are now intentionally scanned for extensions.json, so profile subtrees/files need explicit privacy hardening."
      - "Deep scans accept broad roots by design; hardening must prune sensitive noise without changing deep's explicit-root purpose."
      - "OneDrive and redirected known folders are common on Windows but can be handled first by narrow basename/prefix rules."
      - "Windows junction/reparse behavior and dirKey are important but intentionally deferred to keep this tranche bounded."
      - "Current dirty worktree includes previous Windows compatibility slices; do not revert unrelated changes."
    existing_plan_facts:
      - "This is Goal 6A, not all of Goal 6."
      - "Add Windows-specific excludes for sensitive/high-cost browser, credential, cache, and cloud-sync paths."
      - "Add scanner-side sensitive browser filename skips for explicit broad roots."
      - "Preserve existing metadata discovery paths for package, extension, and MCP config inventory."
      - "Update windows.md only for proven Goal 6 privacy-hardening items."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: "http://goalbuddy.localhost:41737/windows-walker-privacy-hardening/"
    command: "npx goalbuddy board docs/goals/windows-walker-privacy-hardening"
    note: "npm/npx was not available on PATH during goal-prep; files are ready and the board can be started later when npx is available."

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the exact walker/scanner privacy-hardening surface for Goal 6A."
    inputs:
      - "docs/goals/windows-walker-privacy-hardening/goal.md"
      - "windows.md"
      - "README.md"
      - "docs/inventory-sources.md"
      - "internal/walk/walk.go"
      - "internal/walk/walk_test.go"
      - "internal/scanner/scanner.go"
      - "internal/scanner/scanner_test.go"
      - "scripts/windows-smoke.ps1"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not inspect raw browser inventories or raw NDJSON except aggregate redacted smoke evidence."
      - "Keep junction/reparse behavior, dirKey redesign, ACL-denied-path tests, all-users, WSL, new browser roots, native ecosystems, parser/schema/CLI changes, and deployment docs out of the recommended Worker package."
    expected_output:
      - "Current walker exclude and scanner dispatch map"
      - "Windows sensitive/high-cost directory candidates"
      - "Sensitive browser filenames that should be skipped"
      - "Metadata paths that must remain scannable"
      - "Tests to add or update"
      - "Smoke harness update requirements, if any"
      - "Recommended Worker package"
    receipt:
      result: done
      summary: "Goal 6A should harden the existing walker exclude and scanner dispatch boundaries, not change root discovery, parsers, schema, or CLI behavior."
      evidence:
        - "internal/walk/walk.go DefaultExcludes and isExcluded own directory pruning."
        - "internal/scanner/scanner.go skips selected files before files_considered and dispatches exact metadata filenames."
        - "docs/inventory-sources.md defines browser extension metadata as Chromium manifest.json and Firefox extensions.json only."
        - "windows.md Goal 6 has separate unchecked items for junction/reparse, dirKey, ACL-denied diagnostics, and inaccessible-path tests."
      current_map:
        - "internal/walk/walk.go DefaultExcludes already owns credential/cache/high-cost directory pruning and supports basename plus suffix-component matching."
        - "internal/scanner/scanner.go appends walk.DefaultExcludes to user excludes, skips .env/.envrc before files_considered, then dispatches exact metadata filenames."
        - "docs/inventory-sources.md states browser profile siblings are not read, but deep scans may still visit them unless excluded."
        - "scripts/windows-smoke.ps1 already proves redacted end-to-end baseline completion; no new raw inventory fields are required for this tranche."
      windows_directory_candidates:
        - "AppData/Local browser profile parents: Google/Chrome/User Data, Microsoft/Edge/User Data, Chromium/User Data, BraveSoftware/Brave-Browser/User Data, Vivaldi/User Data."
        - "AppData/Roaming browser profile parents: Mozilla/Firefox/Profiles plus LibreWolf/Waterfox equivalents when encountered under broad roots."
        - "Firefox profile subtrees: cache2, storage, sessionstore-backups, extensions."
        - "Windows credential/config/security trees: AppData/Roaming/Microsoft/Credentials, AppData/Local/Microsoft/Credentials, Protect, Vault, Crypto/RSA."
        - "Cloud-sync folders: OneDrive and OneDrive - <tenant> style names; keep matching narrow to avoid unrelated names."
      sensitive_browser_files:
        - "Cookies, Cookies-journal, Login Data, Login Data For Account, History, Web Data."
        - "Firefox cookies.sqlite, places.sqlite, favicons.sqlite, formhistory.sqlite, key4.db, logins.json, sessionstore.jsonlz4."
      must_remain_scannable:
        - "Baseline Chrome/Edge Extensions roots and Firefox Profiles roots."
        - "Firefox profile extensions.json."
        - "Chromium extension manifest.json under Extensions/<id>/<version>."
        - "Project package lockfiles, node_modules package.json, editor extension package.json, and MCP JSON configs."
      recommended_worker_package:
        - "Extend DefaultExcludes plus narrow OneDrive basename/prefix matching."
        - "Add scanner-side sensitive browser filename skip before files_considered."
        - "Add walker/scanner regression tests that prove sensitive paths are pruned/skipped and required metadata still works."
        - "Update windows.md only for proven Goal 6 privacy-hardening items and add a concise receipt."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Approve the exact Worker package for the privacy-first Windows walker hardening slice."
    inputs:
      - "T001 receipt"
      - "windows.md"
      - "Current dirty diff"
    constraints:
      - "Read-only."
      - "Reject parser/schema/CLI/root-kind/output changes, new inventory scope, junction/reparse/dirKey redesign, all-users, WSL, native ecosystems, and deployment docs."
      - "Reject any package that blocks intended package, editor-extension, browser-extension, or MCP metadata discovery."
      - "Approve only the largest safe useful privacy-hardening slice."
    expected_output:
      - "Decision: approved | revise"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "windows.md checkboxes allowed to mark"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      exact_worker_objective: "Implement Goal 6A privacy-first Windows walker hardening by pruning sensitive/high-cost Windows directories, skipping sensitive browser profile files before scanner consideration, proving required metadata remains scannable, and updating only proven windows.md items."
      allowed_files:
        - "internal/walk/walk.go"
        - "internal/walk/walk_test.go"
        - "internal/scanner/scanner.go"
        - "internal/scanner/scanner_test.go"
        - "scripts/windows-smoke.ps1"
        - "windows.md"
      verify_commands:
        - "gofmt -w internal/walk/walk.go internal/walk/walk_test.go internal/scanner/scanner.go internal/scanner/scanner_test.go"
        - "go test -count=1 ./internal/walk ./internal/scanner ./cmd/bumblebee ./internal/ecosystem/browserext"
        - "go test ./..."
        - "CGO_ENABLED=1 go test -race ./..."
        - "powershell -ExecutionPolicy Bypass -File scripts\\windows-smoke.ps1"
        - "git diff --check"
      windows_md_allowed_changes:
        - "Check Goal 6 Windows-specific excludes for high-cost or sensitive paths if tests prove directory pruning."
        - "Check Goal 6 browser profile data exclusion if tests prove profile data dirs/files are pruned/skipped while extension metadata remains scannable."
        - "Check Goal 6 credential and cloud-sync sensitive directories if tests prove those paths are pruned."
        - "Check Goal 6 OneDrive/redirected known folders only for the narrow OneDrive basename/prefix behavior implemented."
      rejected_scope:
        - "Junction/reparse review, dirKey redesign, deep-loop guarantee over junctions, ACL-denied Windows tests, all-users, WSL, native ecosystems, parser/schema/CLI/root-kind/output behavior, new browser roots, and deployment docs."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Execute the Judge-approved Windows walker privacy-hardening slice."
    allowed_files:
