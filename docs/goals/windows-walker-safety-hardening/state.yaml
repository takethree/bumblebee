# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Windows Walker Safety Hardening"
  slug: "windows-walker-safety-hardening"
  kind: existing_plan
  tranche: "Harden Windows walker behavior around junctions, reparse points, and ACL-denied paths before adding more roots."
  status: active
  oracle:
    signal: "Focused Windows tests and smoke verification prove reparse/junction safety and ACL-denied diagnostic behavior without changing shared scanner semantics."
    cadence: "after prerequisite/toolchain recovery, after implementation, and at final audit"
    final_proof: "Focused and broad Go tests pass, Windows smoke passes, windows.md records only proven Goal 6 items, and the branch is pushed."
  intake:
    original_request: "$goalbuddy:goal-prep after the Windows walker safety plan."
    interpreted_outcome: "Prepare a GoalBuddy board for the next compatibility-layer walker hardening slice."
    input_shape: existing_plan
    audience: "Maintainer of the TakeThree Windows compatibility fork"
    authority: approved
    proof_type: test
    completion_proof: "Tests, smoke output, windows.md receipts, and pushed commits prove the Windows walker safety tranche."
    likely_misfire: "Expanding inventory scope or docs while leaving traversal safety weak or unverified."
    blind_spots_considered:
      - "The current shell did not find go, so verification needs a prerequisite recovery step."
      - "Junction/reparse handling is safety-critical before adding more roots."
      - "ACL-denied tests may be environment-sensitive and need an explicit blocker if Windows cannot enforce denial."
      - "Goal 6 has multiple open items; only directly proven items should be checked."
      - "This must stay a compatibility-layer change with no schema, parser, sink, CLI, profile, or root-kind drift."
    existing_plan_facts:
      - "Restore or install a reputable Go toolchain before implementation verification."
      - "Add or verify Windows reparse/junction traversal guard in internal/walk."
      - "Treat the reparse guard as the supplement to the non-Unix dirKey fallback."
      - "Add tests for reparse/junction skip and loop safety."
      - "Add tests for ACL-denied diagnostics if stable in this environment."
      - "Update windows.md with only proven Goal 6 checkboxes and receipts."
      - "Commit message after implementation should be similar to fix: harden Windows walker reparse handling."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: false
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: blocked
    url: null
    command: "npx goalbuddy board docs/goals/windows-walker-safety-hardening"
    note: "npx returned through Socket Firewall without starting the board: [sfw] Failed to prepare firewall binary; unable to fetch latest release and no valid cached release found. File-backed board is ready."

